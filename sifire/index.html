tieren."}}, {"id": "maint.week.nrvalves", "source_id": "EV-07", "applicability": "weekly", "status": "draft_translation", "text": {"fr": "Contrôler l’étanchéité des clapets anti-retour.", "nl": "Controleer de dichtheid van de terugslagkleppen.", "en": "Check non-return valve tightness.", "de": "Dichtheit der Rückschlagventile prüfen."}}, {"id": "maint.week.prime", "source_id": "EV-07", "applicability": "weekly", "status": "draft_translation", "text": {"fr": "Contrôler le circuit d’amorçage si applicable.", "nl": "Controleer het vulcircuit indien van toepassing.", "en": "Check the priming circuit where applicable.", "de": "Auffüllsystem prüfen, sofern zutreffend."}}, {"id": "maint.week.restart", "source_id": "EV-07", "applicability": "weekly", "status": "draft_translation", "text": {"fr": "Consigner l’essai de redémarrage diesel selon la procédure applicable.", "nl": "Registreer de dieselherstarttest volgens de toepasselijke procedure.", "en": "Record the diesel restart test under the applicable procedure.", "de": "Diesel-Wiederanlaufprüfung gemäß zutreffender Vorgehensweise dokumentieren."}}, {"id": "maint.month.electrolyte", "source_id": "EV-08", "applicability": "monthly", "status": "draft_translation", "text": {"fr": "Contrôler l’électrolyte uniquement pour les batteries concernées.", "nl": "Controleer de elektrolyt alleen bij de betreffende accu’s.", "en": "Check electrolyte only for the applicable battery type.", "de": "Elektrolyt nur bei entsprechendem Batterietyp prüfen."}}, {"id": "maint.month.terminals", "source_id": "EV-08", "applicability": "monthly", "status": "draft_translation", "text": {"fr": "Contrôler corrosion des bornes et état des câbles.", "nl": "Controleer de polen op corrosie en de toestand van de kabels.", "en": "Check terminal corrosion and cable condition.", "de": "Polkorrosion und Kabelzustand prüfen."}}, {"id": "maint.quarter.corrosion", "source_id": "EV-09", "applicability": "quarterly", "status": "draft_translation", "text": {"fr": "Contrôler corrosion des tuyaux et supports.", "nl": "Controleer leidingen en steunen op corrosie.", "en": "Check pipes and supports for corrosion.", "de": "Rohrleitungen und Halterungen auf Korrosion prüfen."}}, {"id": "maint.quarter.valves", "source_id": "EV-09", "applicability": "quarterly", "status": "draft_translation", "text": {"fr": "Consigner l’essai des vannes et leur remise en position normale.", "nl": "Registreer de kleppentest en het herstel van de normale stand.", "en": "Record valve testing and restoration to normal positions.", "de": "Armaturenprüfung und Rückstellung in Normalstellung dokumentieren."}}, {"id": "maint.quarter.stock", "source_id": "EV-09", "applicability": "quarterly", "status": "draft_translation", "text": {"fr": "Vérifier quantité et état des pièces en stock.", "nl": "Controleer aantal en toestand van reserveonderdelen.", "en": "Check spare parts stock quantities and condition.", "de": "Bestand und Zustand der Ersatzteile prüfen."}}, {"id": "maint.half.alarms", "source_id": "EV-10", "applicability": "six_monthly", "status": "draft_translation", "text": {"fr": "Contrôler le système d’alarme et son report.", "nl": "Controleer het alarmsysteem en de doormelding.", "en": "Check the alarm system and remote signalling.", "de": "Alarmsystem und Fernmeldung prüfen."}}, {"id": "maint.half.align", "source_id": "EV-10", "applicability": "six_monthly", "status": "draft_translation", "text": {"fr": "Recontrôler l’alignement de l’accouplement.", "nl": "Controleer de uitlijning van de koppeling opnieuw.", "en": "Recheck coupling alignment.", "de": "Kupplungsausrichtung erneut prüfen."}}, {"id": "maint.year.performance", "source_id": "EV-10", "applicability": "yearly", "status": "draft_translation", "text": {"fr": "Documenter l’essai de chaque pompe à pleine charge.", "nl": "Documenteer de test van elke pomp bij volledige belasting.", "en": "Document each pump test at full load.", "de": "Prüfung jeder Pumpe unter Volllast dokumentieren."}}, {"id": "maint.year.filters", "source_id": "EV-10", "applicability": "yearly", "status": "draft_translation", "text": {"fr": "Contrôler les filtres d’aspiration et les nettoyer si nécessaire.", "nl": "Controleer de zuigfilters en reinig ze indien nodig.", "en": "Inspect suction filters and clean as needed.", "de": "Saugfilter prüfen und bei Bedarf reinigen."}}, {"id": "maint.year.service", "source_id": "EV-10", "applicability": "yearly", "status": "draft_translation", "text": {"fr": "Consigner les remplacements d’huile, filtres, liquide et batteries applicables.", "nl": "Registreer de toepasselijke vervanging van olie, filters, koelvloeistof en accu’s.", "en": "Record applicable oil, filter, coolant and battery replacements.", "de": "Zutreffenden Öl-, Filter-, Kühlmittel- und Batteriewechsel dokumentieren."}}, {"id": "align.type", "source_id": "EV-11", "applicability": "alignment", "status": "draft_translation", "text": {"fr": "Identifier l’accouplement : élastique ou double cardan.", "nl": "Identificeer de koppeling: elastisch of dubbele cardan.", "en": "Identify the coupling: flexible or double universal joint.", "de": "Kupplung identifizieren: elastisch oder Doppelgelenkwelle."}}, {"id": "align.reference", "source_id": "EV-11", "applicability": "alignment", "status": "draft_translation", "text": {"fr": "Renseigner la référence et les tolérances du fabricant d’accouplement.", "nl": "Voer de referentie en toleranties van de koppelingfabrikant in.", "en": "Enter the coupling manufacturer’s reference and tolerances.", "de": "Referenz und Toleranzen des Kupplungsherstellers eintragen."}}, {"id": "align.quarters", "source_id": "EV-11", "applicability": "alignment", "status": "draft_translation", "text": {"fr": "Relever les mesures à chaque quart de tour.", "nl": "Registreer de metingen bij elke kwartslag.", "en": "Record measurements at each quarter turn.", "de": "Messwerte bei jeder Vierteldrehung dokumentieren."}}, {"id": "align.shims", "source_id": "EV-11", "applicability": "alignment", "status": "draft_translation", "text": {"fr": "Consigner les corrections par cales et les mesures finales.", "nl": "Registreer correcties met vulplaten en eindmetingen.", "en": "Record shim corrections and final measurements.", "de": "Korrekturen mit Passblechen und Endmesswerte dokumentieren."}}, {"id": "align.forks", "source_id": "EV-11", "applicability": "alignment", "status": "draft_translation", "text": {"fr": "Pour le cardan, vérifier la coplanarité des fourches intérieures.", "nl": "Controleer bij de cardanas of de binnenste vorken in hetzelfde vlak liggen.", "en": "For the driveshaft, check that the inner forks are coplanar.", "de": "Bei der Gelenkwelle prüfen, ob die inneren Gabeln in einer Ebene liegen."}}, {"id": "align.angles", "source_id": "EV-11", "applicability": "alignment", "status": "draft_translation", "text": {"fr": "Consigner les deux angles de cardan et la référence de montage.", "nl": "Registreer beide cardanhoeken en de montagereferentie.", "en": "Record both universal-joint angles and the installation reference.", "de": "Beide Gelenkwinkel und die Montagevorgabe dokumentieren."}}, {"id": "exhaust.engine", "source_id": "EV-12", "applicability": "exhaust", "status": "draft_translation", "text": {"fr": "Identifier le moteur avant de sélectionner sa limite de contre-pression.", "nl": "Identificeer de motor voordat de tegendrukgrens wordt geselecteerd.", "en": "Identify the engine before selecting its backpressure limit.", "de": "Motor identifizieren, bevor der Abgasgegendruck-Grenzwert gewählt wird."}}, {"id": "exhaust.silencer", "source_id": "EV-12", "applicability": "exhaust", "status": "draft_translation", "text": {"fr": "Renseigner le silencieux et sa perte de charge documentée.", "nl": "Voer de geluiddemper en het gedocumenteerde drukverlies in.", "en": "Enter the silencer and its documented pressure loss.", "de": "Schalldämpfer und dokumentierten Druckverlust eintragen."}}, {"id": "exhaust.drain", "source_id": "EV-12", "applicability": "exhaust", "status": "draft_translation", "text": {"fr": "Contrôler la protection contre la pluie et l’évacuation des condensats.", "nl": "Controleer de regenbescherming en condensafvoer.", "en": "Check rain protection and condensate drainage.", "de": "Regenschutz und Kondensatableitung prüfen."}}, {"id": "exhaust.measurement", "source_id": "EV-12", "applicability": "exhaust", "status": "draft_translation", "text": {"fr": "Consigner la contre-pression et les conditions de mesure.", "nl": "Registreer de tegendruk en meetomstandigheden.", "en": "Record backpressure and measurement conditions.", "de": "Abgasgegendruck und Messbedingungen dokumentieren."}}, {"id": "report.instrument", "source_id": "EV-16", "applicability": "report", "status": "draft_translation", "text": {"fr": "Renseigner les instruments et leur traçabilité d’étalonnage.", "nl": "Registreer de instrumenten en de traceerbaarheid van de kalibratie.", "en": "Record instruments and calibration traceability.", "de": "Messgeräte und Rückführbarkeit der Kalibrierung dokumentieren."}}, {"id": "report.reserves", "source_id": "EV-09", "applicability": "report", "status": "draft_translation", "text": {"fr": "Documenter les anomalies et réserves non levées.", "nl": "Documenteer openstaande afwijkingen en voorbehouden.", "en": "Document unresolved findings and reservations.", "de": "Offene Abweichungen und Vorbehalte dokumentieren."}}, {"id": "report.parts", "source_id": "EV-10", "applicability": "report", "status": "draft_translation", "text": {"fr": "Renseigner les pièces remplacées et leurs références.", "nl": "Registreer vervangen onderdelen en hun referenties.", "en": "Record replaced parts and their part numbers.", "de": "Ersetzte Teile und deren Artikelnummern dokumentieren."}}, {"id": "report.handover2", "source_id": "EV-09", "applicability": "report", "status": "draft_translation", "text": {"fr": "Renseigner la date, le technicien et la remise au client.", "nl": "Registreer de datum, technicus en overdracht aan de klant.", "en": "Record date, technician and customer handover.", "de": "Datum, Techniker und Übergabe an den Kunden dokumentieren."}}], "tables": {"alignment": {"headers": ["electric_rated_power_kW_original", "diesel_rated_power_kW_original", "radial_mm_original", "axial_mm_original", "angular_arcminutes_original"], "rows": [["4", "4,2", "0,10", "2÷3", "33'"], ["5,5–37", "6–10,5", "0,10", "3÷4", "33'"], ["45–55", "12,9–17,7", "0,14", "3÷4", "33'"], ["75–160", "26–66", "0,30", "3÷4", "46'"], ["200–250", "98–226", "0,30", "3÷5", "46'"]], "source": "EV-11", "revision": "rev.1 24/09/24"}, "exhaust": {"headers": ["power_kW", "exhaust_kg_h", "exhaust_m3_h", "exhaust_degC", "max_backpressure_kPa", "silencer_loss_kPa", "connection_mm", "connection_type"], "rows": [[6, 34, 81, 520, 6.5, null, 34, "TH"], [10.5, 85, 202, 620, 8.8, null, 34, "TH"], [17.7, 114, 271, 600, 9, null, 34, "TH"], [26.5, 168, 400, 580, 8.5, 2, 50, "FL"], [31.5, 175.3, 417, 751, 12, 2, 50, "FL"], [37, 220, 524, 560, 12, 2, 50, "FL"], [47.7, 319.3, 760, 628, 12, 2.2, 50, "FL"], [66, 477, 1136, 650, 10, 2, 50, "FL"], [95, 733, 1745, 589, 10, 2, 50, "FL"], [98, 810, 1929, 490, 7, 2.2, 70, "FL"], [131, 880, 2095, 590, 5, 2, 70, "FL"], [177, 1375, 3274, 530, 7, 2, 82.5, "FL"], [200, 1460, 3476, 580, 10, 2.8, 82.5, "FL"], [221, 1485, 3536, 600, 10, 2.8, 82.5, "FL"], [252, 1860, 4429, 510, 10, 2.8, 82.5, "FL"], [333, 2490, 5929, 530, 3, 2.8, 82.5, "FL"]], "source": "EV-12", "revision": "rev.1 21/11/24"}, "cooling": {"headers": ["power_kW", "cooling_type", "cooling_air_m3_h_at15C_dry", "engine_only_coolant_L", "cooling_water_m3_h", "room_ventilation_m3_h"], "rows": [[6, "direct_air", 330, null, null, 670], [10.5, "direct_air", 710, null, null, 1170], [17.7, "direct_air", 1578, null, null, 1970], [26.5, "radiator", 3000, 5, null, null], [31.5, "radiator", 3900, 3.7, null, null], [37, "radiator", 8800, 5, null, null], [47.7, "radiator", 8800, 3.7, null, null], [66, "radiator", 8800, 5, null, null], 200002b0001865400010092.pdf", "status": "PDF ouvert et contenu FR constaté", "scope": "SC-Fire Diesel ; version matérielle/logicielle à identifier", "note": "Couverture en quatre langues, mais fichier consulté contenant la section française. Ne pas déclarer quatre traductions acquises."}, {"id": "WILO-SC-E-2541365", "title": "Wilo-Control SC-Fire Electric", "reference": "2 541 365-Ed.01 / 2014-02-Wilo", "languages_content": ["en"], "pages": 32, "url": "https://cms.media.wilo.com/dcidocpfinder/wilo_f_0200002b0001a1e700010092/1627960/wilo_f_0200002b0001a1e700010092.pdf", "status": "PDF ouvert et contenu EN constaté", "scope": "SC-Fire Electric ; édition historique", "note": "Une édition 02/2015-10 est listée au catalogue ; ce lien vérifié est une édition 01/2014-02. Ne pas mélanger les paramètres entre éditions."}, {"id": "WILO-SC-J-2541363-FR", "title": "Wilo-Control SC-Fire Jockey — FR", "reference": "2 541 363-Ed.01 / 2014-02-Wilo", "languages_content": ["fr"], "pages": 10, "url": "https://cms.media.wilo.com/dcidocpfinder/wilo_f_0200002b0001b18900010092/1627458/wilo_f_0200002b0001b18900010092.pdf", "status": "PDF ouvert et contenu FR constaté", "scope": "SC-Fire Jockey standard", "note": "Ne pas confondre avec coffret Jockey A2P."}, {"id": "WILO-SC-J-2541363-NL", "title": "Wilo-Control SC-Fire Jockey — NL", "reference": "2 541 363-Ed.01 / 2014-02-Wilo", "languages_content": ["nl"], "pages": 10, "url": "https://cms.media.wilo.com/dcidocpfinder/wilo_f_0200002b0001b1d900010092/1627548/wilo_f_0200002b0001b1d900010092.pdf", "status": "PDF ouvert et contenu NL constaté", "scope": "SC-Fire Jockey standard", "note": "Couverture commune ; contenu néerlandais vérifié."}, {"id": "BIMOTOR-FPT-UNLISTED", "title": "Bimotor — FPT UNLISTED Portfolio", "reference": "Titre UNLISTED Portfolio ; révision/date non visibles dans le PDF consulté", "languages_content": ["en"], "pages": 1, "url": "https://www.bimotor.it/static/upload/bim/bimotor_unlisted_portfolio.pdf", "status": "PDF ouvert, 8 références moteur relevées", "scope": "Catalogue sprinkler ; pas fiche du moteur installé", "note": "Données catalogue ; aucun lien automatique avec les lignes par puissance du guide EV-12."}, {"id": "BIMOTOR-SPRINKLER", "title": "Bimotor FPT Distributor — Sprinkler", "reference": "Page web consultée le 21/10/2026", "languages_content": ["en"], "pages": null, "url": "https://fptindustrial.bimotor.it/en/engines/sprinkler.html", "status": "Page consultée", "scope": "Présentation de gamme", "note": "Oriente vers le catalogue, ne fournit pas les abaques de pertes de charge."}, {"id": "BIMOTOR-NOTLISTED", "title": "Bimotor — Not Listed Solutions", "reference": "Page web consultée le 21/10/2026", "languages_content": ["en"], "pages": null, "url": "https://www.bimotor.it/en/products/sprinkler/not-listed-solutions.html", "status": "Page consultée", "scope": "Présentation de solutions non listées", "note": "Radiateur ou échangeur selon variante ; ne suffit pas pour la sélection finale."}, {"id": "BIMOTOR-LISTED", "title": "Bimotor — Listed Solutions", "reference": "Page web consultée le 21/10/2026", "languages_content": ["en"], "pages": null, "url": "https://www.bimotor.it/en/products/sprinkler/listed-solutions.html", "status": "Page consultée", "scope": "Présentation UL/FM", "note": "Ne pas importer la conformité UL/FM dans une configuration EN 12845 par simple nom de famille moteur."}, {"id": "CLARKE-EXHAUST-CALC", "title": "Clarke — Exhaust Backpressure Calculator", "reference": "Page web consultée le 21/10/2026", "languages_content": ["en"], "pages": null, "url": "https://clarkefire.com/design-tools/pump-room-calculators/exhaust-backpressure-calculator", "status": "Page consultée ; aucun calcul soumis", "scope": "Moteurs Clarke", "note": "Référence comparative pour les champs du futur calculateur ; ne valide pas un moteur FPT/Bimotor."}], "pages": [{"id": "EV-01", "ordre_note": 1, "titre": "Programme de formation — jour 1", "reference_visible": "WILO FireFighting Systems – Service Training | October 2026", "analyse_fr": "Formation WILO-SiFire et WILO-FireSet, usine WILO de Bari, 20–21 octobre 2026. Invitation datée du 11 octobre 2026. M. Loiacono : invitation et animation ; G. Straziota : minutes et chronométrage. Jour 1 : présentation de WILO Italia, visite usine, atelier diesel BiMotor sur banc IVECO ; activité pratique IVECO N67 ; exigences de pré-mise en service EN 17451 ; exemples de mauvaise installation ; théorie et guides rapides de pré-mise en service/mise en service. Intervenants techniques indiqués : équipe BiMotor, A. Qazimi et L. Datteo. Le programme ne constitue pas un manuel moteur.", "illustrations": "Tableau de programme et participants.", "limites": "Seul original binaire archivé. Données personnelles des autres participants non retranscrites dans le dossier technique.", "lecture": "consultation visuelle", "original_archive": true, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-02", "ordre_note": 2, "titre": "Programme de formation — jour 2", "reference_visible": "WILO ITALIA workshop — Hands-On", "analyse_fr": "Récapitulatif et questions à 08:30 ; cas terrain, garantie, stock et après-vente à 09:00 ; atelier N45 et pré-mise en service pratique à 09:45, durée 2 h ; aperçu des coffrets VdS, N45 et FM ; bilan final. Le programme présente deux activités à 12:00 et une fin à 13:45, alors que le cartouche du jour 1 donne 13:00 : conserver cette incohérence de programme. Les supports détaillés des coffrets et de la garantie ne sont pas joints.", "illustrations": "Tableau programme.", "limites": "Original non exporté.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-03", "ordre_note": 3, "titre": "Formulaire de pré-mise en service — page 1", "reference_visible": "Check list for pre-commissioning (EN 17451) — Wilo FireSet-…-N45 with electric motor/diesel engine", "analyse_fr": "Identification : entreprise/client, site, numéro équipement, numéro travail, motif pré-mise en service ou mise en service ; description FireSet, article/modèle/année, numéro de série, type pompe ; électrique/diesel ; débit nominal m³/h, pression bar ; pressions de démarrage principale et jockey. Le formulaire cite EN 17451 §10.2.1, vérification des performances §10.2.2 et contrôles installateur §10.4 ; documenter les deux même si réalisés séparément à l'usine et à destination.\nMesures diesel (essai 1,5 h) : vitesse à débit nul et à débit nominal, pression de refoulement vanne fermée, hauteur/pression à l'aspiration, pression au débit nominal après diaphragme, débit nominal, température ambiante, élévation de température de refroidissement, débit de refroidissement bypass diesel, débit bypass pompe, élévation de température d'huile, température initiale et élévation du circuit moteur fermé.\nMesures électrique (essai 0,5 h) : vitesses, pressions, débit, température ambiante, débit bypass et tension/courant/fréquence.", "illustrations": "Formulaire à champs et unités.", "limites": "Certains petits caractères exigent le fichier original pour une transcription diplomatique.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-04", "ordre_note": 4, "titre": "Formulaire de pré-mise en service — page 2", "reference_visible": "Suite du formulaire EV-03", "analyse_fr": "Courbe hydraulique du groupe assemblé : vanne fermée (essai ou correction à la pression d'entrée maximale), demande maximale Qmax, Q100, 140 % de Q100 ; colonnes Q [m³/h] et H [mca]. Contrôles installateur : tuyaux/supports conformes et fixés ; carburant et réservoir ; échappement ; fixation et alignement selon tolérances constructeur, cales et couples des boulons ; drains et conduites de débit raccordés ; alimentation AC ; batteries remplies et chargées ; niveau d'huile ; refroidissement moteur ; câblage/terre ; absence de contraintes aux raccordements rigides ; remplissage et inspection ; vannes aspiration et refoulement ouvertes.\nNe jamais faire fonctionner à sec. Précharge du vase jockey : pression 0,5 bar sous la pression de démarrage de la jockey, sans dépasser la limite du vase. Vérifier serrage des bornes, remplissage, dommages transport, conditions de sécurité et système complet. Zones remarques, lieu/date, technicien et remise au client.", "illustrations": "Formulaire courbe et contrôle.", "limites": "Original non exporté ; ne pas transformer les avertissements résumés en autorisation de manœuvre.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-05", "ordre_note": 5, "titre": "Formulaire de mise en service — page 1", "reference_visible": "Check list for commissioning (EN 17451) — Wilo FireSet-…-N45", "analyse_fr": "Identification identique au formulaire pré-mise en service. Personnel qualifié ; conformité de l'ensemble à vérifier avant mise en service (le formulaire cite la directive 2006/42/EC annexe I-1.8 ; référence à confirmer sur original). Contrôles généraux : ventilation ; température du local >4 °C électrique et >10 °C diesel ; accès libre et sûr ; fixation du châssis ; circuits hydrauliques et électriques ; circuit à diaphragme ; réservoir d'amorçage si aspiration en dépression ; vannes ouvertes ; pompe amorcée et air purgé ; alimentation conforme à la plaque ; câbles dans le bon ordre.\nÉlectrique : alignement, lubrification paliers si applicable, boulons, alimentation, tensions L1-L2/L1-L3/L2-L3, sens de rotation triphasé, démarrage manuel, bruits/vibrations/cavitation, étanchéité vannes et circuit, courant de chaque phase, arrêt manuel, démarrage par pressostat, démarrage par flotteur si applicable, essai 30 minutes à pleine charge de tous les points de débit (Qmax cité avec EN 12845 §3.42), relevé débit/pressions/coffret, débit circuit diaphragme, voyants/alarmes. Début section diesel : alignement.", "illustrations": "Checklist à cocher.", "limites": "Référence directive et conditions d’essai à confirmer sur manuel applicable ; ne pas étendre le Qmax à un autre groupe.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-06", "ordre_note": 6, "titre": "Formulaire de mise en service — page 2", "reference_visible": "Suite EV-05", "analyse_fr": "Diesel : serrage des fixations ; arrêt manuel ; filtre à air propre/installé ; carburant adapté et niveau (faire l'appoint moteur froid) ; raccordements carburant ; refroidissement et vannes ; batteries chargées (raccordement si non effectué) ; bornes batteries ; tension courroies ; durites et colliers ; étanchéité échappement, contre-pression, isolation, silencieux et piège à condensats ; alimentation conforme ; huile et refroidissement ; lubrification pompe si applicable ; démarrage manuel ; bruits/vibrations/cavitation ; étanchéité ; température eau/huile ; démarrage par pressostat et flotteur si applicable ; essai 30 min à pleine charge avec mesures ; débit diaphragme ; voyants/alarmes.\nJockey : tensions entre phases, sens de rotation triphasé, bruits/vibrations/cavitation, étanchéité vannes et circuits, démarrage et arrêt automatiques au pressostat. Remarques et remise au client.", "illustrations": "Checklist à cocher.", "limites": "Cette feuille d’essai 30 min et la vérification diesel 1,5 h décrivent des activités distinctes : ne pas fusionner les durées.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-07", "ordre_note": 7, "titre": "Maintenance hebdomadaire", "reference_visible": "Check list for maintenance (EN 12845) WEEKLY–MONTHLY — FireSet N45, page 1", "analyse_fr": "Ventilation/température ; inspection générale alimentation électrique/eau et absence de fuite ; nettoyage ; étanchéité clapets ; coffret en automatique ; fonctionnement coffret et LED ; alarme niveau minimum réservoir/citerne/puits ; connexions sans brûlure, isolant endommagé ou vis desserrée ; précharge vases ; alarme carburant ; réchauffeur huile ; charge et chargeurs batteries ; électroaimant d'arrêt ; viscosité/niveau huile pompe ; amorçage notamment aspiration en dépression ; relever toutes les pressions eau/air et tous les niveaux ; position des vannes principales.\nEssai démarrage automatique : contrôler carburant et huile diesel, réduire la pression du dispositif de démarrage, enregistrer la pression de démarrage, vérifier pression d'huile et débit échangeur si présent. Essai redémarrage diesel : 20 minutes au point nominal, arrêt puis redémarrage manuel immédiat ; relever refroidissement primaire, pression huile, température moteur, débit refroidissement ; inspecter fuites carburant/eau/gaz ; vérifier admission/ventilation/filtre/obstructions.\nLa numérotation visible saute plusieurs numéros : conserver des identifiants internes stables sans inventer des opérations absentes.", "illustrations": "Checklist et champs de mesure.", "limites": "Pas de valeurs universelles de pression huile/température ou de capacité carburant dans cette feuille.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-08", "ordre_note": 8, "titre": "Maintenance mensuelle", "reference_visible": "Suite WEEKLY–MONTHLY, page 2", "analyse_fr": "Vérifier niveau et densité d'électrolyte de toutes les cellules des batteries au plomb concernées, y compris démarrage diesel et alimentation coffret ; si densité faible, vérifier le chargeur puis remplacer les batteries défectueuses si le chargeur fonctionne ; corrosion des bornes et état des câbles/raccords. Applicabilité à distinguer pour AGM et batteries sans entretien. Pièces remplacées, remarques, lieu/date, technicien, remise au client.", "illustrations": "Checklist mensuelle.", "limites": "Densité cible non donnée.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-09", "ordre_note": 9, "titre": "Maintenance trimestrielle", "reference_visible": "Check list for maintenance (EN 12845) QUARTERLY–SIX-MONTHLY–YEARLY — page 1", "analyse_fr": "Rapport signé et daté remis à l'utilisateur final, travail effectué/requis et facteurs extérieurs ayant influencé les résultats. Contrôler corrosion des tuyaux/supports et peinture si nécessaire ; mise à la terre (ne pas utiliser la tuyauterie sprinkler comme terre du matériel électrique) ; alimentations en eau de chaque poste, démarrage automatique, pression et débit au moins égaux au projet et consignation des changements ; manœuvre de toutes les vannes concernées puis remise dans leur position normale ; débitmètres ; quantité et état des pièces en stock.", "illustrations": "Checklist trimestrielle.", "limites": "Seuils de pression/débit du projet à renseigner.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-10", "ordre_note": 10, "titre": "Maintenance semestrielle et annuelle", "reference_visible": "Suite QUARTERLY–SIX-MONTHLY–YEARLY — page 2", "analyse_fr": "Semestre : contrôle système d'alarme/report au contrôle central ; alignement de l'accouplement.\nAnnée : essai de chaque pompe à pleine charge sur ligne d'essai et vérification des valeurs de plaque en tenant compte des pertes entre réserve et postes ; essai de non-démarrage diesel/alarme puis redémarrage manuel selon procédure ; vannes à flotteur réservoirs ; filtres d'aspiration et chambres de décantation avec nettoyage ; huile moteur et filtres huile/carburant ; contrôle/remplacement liquide de refroidissement ; remplacement batteries. Remarques, pièces et remise au client.", "illustrations": "Checklist semestrielle/annuelle.", "limites": "Procédure détaillée de simulation non-démarrage non fournie : bloquer l’assistant de simulation tant qu’elle manque.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-11", "ordre_note": 11, "titre": "Guide rapide — alignement", "reference_visible": "QUICK GUIDE – ALIGNMENT, rev.1 24/09/24", "analyse_fr": "Deux accouplements : élastique avec entretoise et double cardan/universel. Contrôle nécessaire après installation avant mise en service, tous les six mois, après remplacement pompe/moteur/accouplement, manutention, démontage/remontage et alignement de colonne/tuyauterie. Aligner le moteur sur la pompe. Alignement usine ne dispense pas du contrôle après transport. Joint antivibratoire aspiration indiqué obligatoire pour D, DJ, EDJ, DDJ et suggéré pour E, EJ, EEJ.\nÉlastique : défauts axial/radial/angulaire ; table de tolérances extraite séparément. Mesurer l'écartement S au pied à coulisse à chaque quart de tour ; contrôle radial à la règle ; correction par cales sous pieds ; rotation manuelle pour vérifier le jeu ; deux vis de fixation indiquées, une par demi-accouplement, selon notice. Aligneur laser possible selon instructions du fabricant de l'accouplement.\nCardan : les deux fourches intérieures de l'arbre doivent être dans un même plan ; angles des deux articulations égaux β1 = β2 = 2°. Le document indique que l'angle de travail de 2° dépend de la conception de l'ensemble et des dimensions/instructions constructeur. Il ne signifie pas tolérance de désalignement arbitraire. Valeurs finales à confirmer par fabricant de l'accouplement. Intervention par personne compétente.", "illustrations": "Photos d’accouplements ; schémas axial/radial/angulaire ; règle et pied à coulisse ; schéma cardan et joint aspiration.", "limites": "Unités angulaires du tableau : minutes d’angle (1/60°), pas degrés. Aucun couple de serrage fourni.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-12", "ordre_note": 12, "titre": "Guide rapide — échappement", "reference_visible": "QUICK GUIDE – EXHAUST SYSTEM, rev.1 21/11/24", "analyse_fr": "Évacuation extérieure des gaz diesel. A silencieux : intégrer sa perte de charge au dimensionnement ; type industriel standard, réduction annoncée environ 16 dB/A jusqu'à 7 m. B protection thermique : isolation et protection contre contact brûlant, limiter apport radiatif au local. C condensats : drain résistant aux condensats acides, protection pluie et retour condensats au moteur ; exemple vanne de vidange à vider en maintenance. D compensation : canalisation fixée/supportée, prendre en compte dilatation thermique, exemple joint compensateur au moteur.\nTableau puissance/débit massique/débit volumique/température/contre-pression max/perte silencieux/raccord/type conservé en CSV. Note SiFire : raccord femelle fileté dans l'intervalle fermé 6–95 kW, distinct de la colonne générale TH/FL du tableau. Contre-pression à ne pas dépasser pour le moteur installé. Sortie loin des portes/fenêtres et sans retour au local ; tuyau aussi court que possible, idéalement ≤5 m ; minimum de coudes. La phrase anglaise concernant le rayon des coudes « smaller radius, up to 2,5 times the diameter » est ambiguë : ne pas convertir en règle de calcul sans clarification constructeur.", "illustrations": "Schéma A/B/C/D et tableau 16 puissances.", "limites": "Aucun abaque Bimotor ni coefficient de coude/perte linéaire dans la note. Un diamètre de raccord n’est pas un diamètre calculé de tuyauterie.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-13", "ordre_note": 13, "titre": "Guide rapide — ventilation", "reference_visible": "QUICK GUIDE – VENTILATION, rev.1 21/11/24", "analyse_fr": "Air frais à proximité du sol, extraction en hauteur près du plafond, préférablement à l'opposé ; admission et échappement dégagés, rejet loin des ouvrants. Q ventilateur minimal indiqué : refroidissement direct air Q[m³/h] = 100 × puissance moteur[kW] ; radiateur air/eau même formule ; échangeur eau/eau Q = 50 × puissance. S1 surface nette minimale admission ; S2 sortie à dimensionner avec ventilateur choisi ; fonctionnement du ventilateur également en absence d'alimentation principale. Avec radiateur le débit de refroidissement peut aussi assurer la ventilation. Tableau de débits/surfaces/chaleur rayonnée extrait séparément. Dépression maximale du local portes fermées lors de l'extraction : 20 Pa. Formules et tableau ne sont pas numériquement identiques pour toutes les lignes : garder les deux sources sans forcer une équivalence.", "illustrations": "Trois schémas de circulation d’air ; tableau 27 configurations.", "limites": "Courbe ventilateur, pertes grilles/conduits, calcul thermique complet et puissance auxiliaire manquent.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-14", "ordre_note": 14, "titre": "Guide rapide — refroidissement", "reference_visible": "QUICK GUIDE – COOLING SYSTEM, rev.1 21/11/24", "analyse_fr": "Trois modes : air direct sur bloc, radiateur air/eau à circuit fermé, échangeur eau/eau avec eau brute du refoulement de pompe et circuit fermé moteur. Un même moteur peut recevoir radiateur ou échangeur : identifier l'installation. Vérifier niveau à froid avant mise en service/maintenance ; eau <60 °C avant ouverture/opération concernée. Températures indicatives de fonctionnement : eau autour de 95 °C, huile autour de 105 °C (pas seuils d’alarme universels). Pour échangeur : trois vannes ouvertes et débit présent. Boucle standard : réglage réducteur indiqué 3 bar ; pression résiduelle sortie échangeur environ 0,5–1 bar ; bypass normalement fermé. Vérifier circuit de rejet pour éviter stagnation d'eau chaude liée à pertes élevées/faible pression disponible.\nTableau indicatif quantités air/eau, volume liquide moteur seul et ventilation ; capacités de liquide peuvent seulement être supérieures suivant système, demander au fabricant le type et volume exacts. Les circuits auxiliaires sont exclus des volumes.", "illustrations": "Photos de trois modes ; schéma boucle échangeur ; tableau 27 configurations.", "limites": "Conflit avec EV-23 : aval réducteur max 2,5 bar. Ne pas choisir automatiquement 3 ou 2,5 bar : configuration et notice à confirmer.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-15", "ordre_note": 15, "titre": "Guide vérification performances — exigences", "reference_visible": "QUICK GUIDE – VERIFICATION OF PERFORMANCE, rev.1 15/12/25", "analyse_fr": "Le guide cite EN 17451 §10.2 essais de pré-mise en service, §10.2.2 performances et §10.4 contrôles installateur. Diesel ≥1,5 h au débit nominal ; électrique ≥0,5 h. Courbe assemblée : vanne fermée à pression d'entrée maximale ou corrigée ; demande max Qmax (EN 12845:2015+A1:2019 §3.42 ou prEN 12845-1:2021 clause 25 suivant applicabilité) ; Q100 ; 1,4×Q100. Enregistrer vitesses à débit nul/nominal, aspiration, refoulement au nominal après diaphragme, température ambiante, élévation refroidissement après 1,5 h, débits bypass diesel et pompe, V/A/fréquence électrique, élévation huile, températures initiale et finale circuit fermé échangeur.\nContrôles installateur : tuyauterie/supports ; carburant ; échappement ; fixation/alignement/cales/couples ; drains ; électricité AC ; batteries ; huile ; refroidissement. Avant mise en service vérifier câblage/terre, absence de contrainte, remplissage et inspection, vannes ouvertes.", "illustrations": "Deux colonnes de procédures.", "limites": "Les références historiques/prEN sont celles du support et ne valent pas vérification de l’édition normative applicable en 2026.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-16", "ordre_note": 16, "titre": "Guide vérification performances — lieu et traçabilité", "reference_visible": "Suite QUICK GUIDE – VERIFICATION OF PERFORMANCE, rev.1 15/12/25", "analyse_fr": "Performances diesel 1,5 h, électrique 0,5 h et courbe hydraulique : à l'usine ou sur site. Contrôles de pré-mise en service et mise en service : obligatoirement sur site selon le guide. Personnel compétent, équipements adaptés étalonnés et traçables. La vérification usine ne couvre pas les contrôles de pré-mise en service à destination ; produire la documentation de rapport conforme aux exigences applicables.", "illustrations": "Tableau activité/lieu.", "limites": "Aucun certificat usine joint.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-17", "ordre_note": 17, "titre": "Guide rapide — fixation", "reference_visible": "QUICK GUIDE – SYSTEM FIXING, rev.1 05/11/24", "analyse_fr": "Dalle et ancrages à qualifier par concepteur structure professionnel selon charge, béton et ancrages. Exemple proposé : béton RCK 45 N/mm², treillis 20×20 cm et armature minimum « no.3 » (désignation à clarifier), hauteur minimum 15 cm ; débord par rapport au cadre métallique minimum 10 cm ; masse béton au moins 2,5 fois masse machine ; ancrage à expansion FAZ II Plus, longueur minimum 10 cm ou équivalent ; utiliser trous du châssis, sinon au minimum deux ancrages sur chaque grand côté aux quarts de longueur depuis les extrémités et un sur chaque petit côté à mi-longueur. Espace libre recommandé ≥80 cm de chaque côté et entre unités. Certains SiFire FIRST, FireSet, Atmos GIGA NF peuvent avoir cadre immergé ou servir de coffrage suivant notice.", "illustrations": "Schémas dalle, fixation et implantation ; dessin central à petites cotes.", "limites": "Petites cotes du dessin central non intégralement lisibles ; ne pas les recréer. Numéro no.3 ne pas convertir en diamètre sans source.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-18", "ordre_note": 18, "titre": "Guide rapide — batteries", "reference_visible": "QUICK GUIDE – BATTERIES, rev.1 21/11/24", "analyse_fr": "Batteries plomb ou AGM ; en 12 V deux ensembles A/B chacun une batterie (2 au total), en 24 V deux ensembles A/B chacun deux batteries (4 au total). Coffret alarme additionnel peut nécessiter une batterie supplémentaire. Tableau recommandé par puissance : SiFire plomb et FireSet AGM, sans interchangeabilité automatique.\nInstallation : interrupteur principal coupé et sécurisé ; raccorder pôles selon instructions, batteries partiellement préchargées, éviter court-circuit ; l'ensemble peut devenir actif dès raccordement ; charge une fois coffret activé. Remplacement : état de charge, fonctionnement chargeurs, fusibles ; en 24 V vérifier tensions individuelles cohérentes ; courbe de charge ; après une journée de recharge courant <1 A, tension autour de 27 V pour 24 V et 14 V pour 12 V. Ne jamais connecter/déconnecter moteur tournant. Fonctionnement batterie lié au stockage, ventilation et local 10–40 °C. Hebdomadaire : essai auto et moteur ≥20 min ; mensuel : électrolyte batteries non sans entretien ; remplacement suggéré environ annuel.", "illustrations": "Courbe de charge typique et tableau 16 puissances.", "limites": "Ces tensions sont des repères du guide, pas une consigne universelle de charge AGM. Références précises batteries/chargeurs absentes.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-19", "ordre_note": 19, "titre": "Vérification performances diesel — feuille 1/5", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Procédure proposée à adapter aux conditions du site ; renvoi checklist FireSet N45. Op.1 température ambiante avec thermomètre étalonné ±1 °C. Op.2 déposer carter d'accouplement pour poser une pastille réfléchissante de mesure optique ; la fiche ne détaille pas la remise du protecteur : compléter les conditions de sécurité par notice avant exécution. Op.3 ouvrir refoulement environ 30 %. Op.4 démarrer diesel manuellement au régime nominal de plaque selon OM. Op.5 relever température initiale refroidissement moteur au coffret (circuit fermé).", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté ; valeurs lues visuellement, validation constructeur requise avant automatisation.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-20", "ordre_note": 20, "titre": "Vérification performances diesel — feuille 2/5", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Op.6 température initiale entrée échangeur, thermomètre infrarouge étalonné ±1 °C ; l'intitulé parle d'élévation finale mais la consigne dit bien mesure initiale. Op.7 augmenter approximativement à 102 % du régime nominal pompe. Op.8 ouvrir progressivement jusqu'à Qr de plaque FireSet (incluant pertes colonne humide) ; régime diesel diminue. Op.9 fermer entièrement refoulement. Op.10 relever pression vanne fermée. Le maintien à débit nul requiert les conditions de refroidissement prévues par la notice.", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté ; valeurs lues visuellement, validation constructeur requise avant automatisation.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-21", "ordre_note": 21, "titre": "Vérification performances diesel — feuille 3/5", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Op.11 vitesse à débit nul, tachymètre laser étalonné, indication ±10 rpm. Op.12 seulement lorsqu'un bypass de pompe est présent (pompes électriques/diesel refroidies air) : vérifier débit au moins 2 % du débit nominal de pompe, débitmètre installé ou ultrason étalonné. Op.13 ouvrir progressivement jusqu'à Q100 ; mesurer sur circuit de refoulement. La colonne outillage mentionne un débitmètre bypass alors que le commentaire dit refoulement : anomalie de fiche à clarifier.", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté ; valeurs lues visuellement, validation constructeur requise avant automatisation.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-22", "ordre_note": 22, "titre": "Vérification performances diesel — feuille 4/5", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Op.14 vitesse au débit nominal, tachymètre laser étalonné ±10 rpm. Op.15 pression refoulement au nominal après tout diaphragme, manomètre FireSet. Op.16 pression/hauteur aspiration via manomètre aspiration. Op.17 débit de refroidissement bypass diesel, débitmètre ultrason étalonné sur retour au bassin depuis échangeur.", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté ; valeurs lues visuellement, validation constructeur requise avant automatisation.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-23", "ordre_note": 23, "titre": "Vérification performances diesel — feuille 5/5", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Op.18 pression boucle échangeur : pression amont réducteur approximativement pression refoulement pompe ; aval réducteur maximum 2,5 bar. Autre op.18 : faire tourner FireSet à Q100 pendant 1,5 h (doublon de numéro conservé). Op.19 mesurer température à l'entrée échangeur et calculer élévation par rapport à initiale, thermomètre IR étalonné ±1 °C. Op.20 relever température refroidissement moteur au coffret et son élévation circuit fermé. Le titre parle de « starting temperature and increasing temperature » : stocker initiale, finale et delta séparément.", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté ; valeurs lues visuellement, validation constructeur requise avant automatisation.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-24", "ordre_note": 24, "titre": "Vérification performances électrique — feuille 1/4", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Op.1 température ambiante, thermomètre étalonné ±1 °C. Op.2 pastille réfléchissante sur élément tournant avec dépose carter indiquée ; procédure de protection à compléter avant exécution. Op.3 ouvrir refoulement environ 30 %. Op.4 démarrage manuel au régime nominal de plaque, suivre OM. Op.5 « Increase the engine speed approximately up to of the 102% rpm of the nominal pump speed » : texte présent dans la fiche électrique, applicabilité non établie ; ne pas proposer cette opération sans confirmation.", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-25", "ordre_note": 25, "titre": "Vérification performances électrique — feuille 2/4", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Op.6 ouvrir progressivement jusqu'à Qr FireSet, incluant pertes colonne humide. Op.7 fermer entièrement refoulement. Op.8 relever pression vanne fermée. Op.9 vitesse à débit nul, tachymètre laser étalonné, ±10 rpm. Le commentaire indique lecture vitesse moteur sur coffret : comparer mesure indépendante et lecture coffret.", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-26", "ordre_note": 26, "titre": "Vérification performances électrique — feuille 3/4", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Op.10 si bypass présent : débit minimum 2 % du débit nominal pompe, débitmètre installé ou ultrason étalonné. Op.11 ouvrir progressivement refoulement jusqu'à Q100, relever débit du circuit de refoulement ; incohérence colonne outillage « débitmètre bypass » à clarifier. Op.12 vitesse à Q100, tachymètre étalonné ±10 rpm, lecture coffret indiquée.", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}, {"id": "EV-27", "ordre_note": 27, "titre": "Vérification performances électrique — feuille 4/4", "reference_visible": "VERIFICATION OF PERFORMANCE (Ref. EN 17451 – 10.2.2) – rev.0 ; Edition 00 ; 20/07/2026 ; Written by DL", "analyse_fr": "Op.13 pression refoulement au débit nominal après diaphragme, manomètre FireSet. Op.14 pression/hauteur aspiration, manomètre aspiration. Op.15 marche à Q100 pendant 0,5 h. Op.16 relever tension, courant en marche et fréquence sur IHM coffret. Pas de seuil d'acceptation universel V/A/Hz fourni.", "illustrations": "Tableau opération/outillage/donnée-tolérance/commentaire.", "limites": "Original non exporté.", "lecture": "consultation visuelle", "original_archive": false, "transcription": "extraction structurée, non fac-similé intégral"}], "bench": {"id": "BARI-BENCH-2026-10-21", "version": "1.0", "date_on_screen": "21/10/26", "basis": "user_supplied_photographs", "status": "educational_observations_not_acceptance_report", "files_received": 28, "unique_images": 27, "inventory": [{"file": "IMG_3825.jpeg", "sha256": "b1b4d77ac8c4bf2544d3011f622d4ba795316b83b3fc92375a6e409520702560", "bytes": 789590, "kind": "benchHardware", "identical_to": null, "inspected": true}, {"file": "IMG_3826.jpeg", "sha256": "f24fe549be8abafdce4a6556df359e10fe4d9900e1a843bf3699db31f33fb794", "bytes": 703223, "kind": "benchHardware", "identical_to": null, "inspected": true}, {"file": "IMG_3827.jpeg", "sha256": "715ac257c6f6859985b56c25dfbb63e24df30921cd8be0165149326e05378d23", "bytes": 373116, "kind": "benchHardware", "identical_to": null, "inspected": true}, {"file": "IMG_3828.jpeg", "sha256": "b32133d45106d6ae63f416ba36f41f900870a716fef42b16423dcdb3d81bac97", "bytes": 689574, "kind": "benchHardware", "identical_to": null, "inspected": true}, {"file": "IMG_3829.jpeg", "sha256": "d5bbe75a6f5efb384f203c5d1365a82bd0948261ff2bbad1c0188036dfbadba1", "bytes": 754178, "kind": "benchHardware", "identical_to": null, "inspected": true}, {"file": "IMG_3830.jpeg", "sha256": "11792bc91aa137a1d2f1acf333802fcff7714e4ad2241ed278b25e471e1e87a6", "bytes": 920428, "kind": "benchHardware", "identical_to": null, "inspected": true}, {"file": "IMG_3833.jpeg", "sha256": "c662ff9097844051d401ce055b7f7125a59186f6da011f4be678253c6bd5f4ac", "bytes": 476141, "kind": "benchScreen", "identical_to": null, "inspected": true}, {"file": "IMG_3834.jpeg", "sha256": "fc65d4 : "Matériel et documents observés", "benchIdentityText": "Pompe horizontale entraînée par diesel ; petite pompe verticale à proximité, fonction jockey probable à confirmer. Coffret marqué EN 17451 System. Fiche : Atmos GIGA NF 125/250.1, document C125250.1-N37, révision 01, 08/04/2026, page 1/2, 50 Hz, 2 985 tr/min. Courbes Ø250/260/274 mm ; Ø250 surligné. La photo ne prouve ni le diamètre monté ni l’identité exacte du groupe.", "benchReadings": "16 captures d’écran distinctes", "benchReadingNote": "Chiffres transcrits tels qu’affichés, point décimal d’origine conservé. « olio » et « acqua » sont les libellés du logiciel : emplacement des sondes à confirmer. DN65 et DN200 désignent les voies du banc ; DN150/DN300 sans valeur lisible restent inconnus. L’heure de chaque photo n’est pas établie.", "benchSampling": "Échantillonnage affiché", "benchHead": "Hauteur affichée", "benchFlow": "Débit total affiché", "benchWarning": "Écart d’affichage à vérifier", "benchMismatch": "IMG_3836 : 18.08 + 106.06 = 124.14 m³/h sur les voies, mais total affiché 109 m³/h et hauteur 53.1 m. IMG_3837/3838 : mêmes valeurs des voies, total 124 m³/h et hauteur 73 m. Cause inconnue : rafraîchissement ou état de capture possible, sans diagnostic certain. Conserver les deux lectures ; ne pas corriger automatiquement.", "benchPlot": "Points photographiés avec affichage ON", "benchPlotNote": "Nuage descriptif sans liaison ni interpolation. Les huit captures ON se situent entre 2 972 et 3 000 tr/min. ON indique l’état affiché de l’échantillonnage, sans prouver un palier stabilisé. Ce graphique n’est pas une courbe certifiée ; les points OFF à d’autres régimes ne sont pas mélangés.", "benchInterpret": "Lecture technique et limites", "benchThermal": "La séquence numérotée montre la montée des températures « olio » de 25 à 87 °C et « acqua » de 27 à 76 °C. On observe ensuite plusieurs affichages à 76 °C. Cela ne démontre ni la durée d’essai prescrite ni le respect d’une limite moteur : son code complet et les positions des sondes manquent.", "benchNearZero": "IMG_3848 : 4 m³/h et 93.9 m à 3 000 tr/min. C’est un point de faible débit, pas un débit nul prouvé. Une voie indique encore 3.34 m³/h. Le rôle exact du bypass et du refroidissement exige le schéma hydraulique.", "benchSettings": "« Nominal Flow 100 m3/h » et « T.Preload 10 min » sont des réglages visibles. Ils ne suffisent pas à établir le débit nominal réel du groupe ou la durée effectivement réalisée. Les annotations manuscrites de la courbe ne sont pas des points d’essai certifiés.", "benchPressure": "Une pression d’aspiration négative est affichée ; elle ne suffit pas à conclure à une cavitation. Pour comparer la hauteur : H = (p₂ − p₁)/(ρg) + (v₂² − v₁²)/(2g) + z₂ − z₁. Exemple IMG_3842 : 7.90 − (−0.23) = 8.13 bar, soit environ 82.87 m avec ρ = 1 000 kg/m³ et g = 9.81 m/s², avant corrections de vitesse et d’altitude. Le banc affiche 82.9 m ; son algorithme n’est pas documenté.", "benchCabinetText": "Coffret : deux voies A/B et deux modules de charge visibles, relais/contacteurs et borniers repérés. Les prises ressemblent à des RJ45 ; ni protocole Ethernet ni brochage ne peuvent être déduits de leur forme. Les étiquettes « Pump running » et « FUEL TANK NOT FULL » servent de repères photographiques, sans logique de contact confirmée.", "benchToolsText": "Visible : supervision du banc, manomètres/capteurs et thermomètre infrarouge tenu par l’opérateur. Pour rendre un relevé exploitable : consigner références, unités, points de mesure, certificats d’étalonnage et acquisition synchronisée. Une mesure infrarouge de surface ne remplace pas la température interne du fluide.", "benchMissing": "Informations encore manquantes", "benchMissingText": "Plaques pompe/groupe/moteur et roue montée ; page 2/2 de la courbe et rapport d’essai complet ; point nominal réel et critère d’acceptation applicable ; export horodaté du banc et certificats capteurs ; température de l’eau pompée, niveaux et diamètres aux prises de MG_3836: 18.08 + 106.06 = 124.14 m³/h op de kanalen, maar totaal 109 m³/h en hoogte 53.1 m. IMG_3837/3838: dezelfde kanaalwaarden, totaal 124 m³/h en hoogte 73 m. Oorzaak onbekend: mogelijk verversing of opnamefase, zonder zekere diagnose. Beide waarden bewaren; niet automatisch corrigeren.", "benchPlot": "Gefotografeerde punten met ON-weergave", "benchPlotNote": "Beschrijvende punten zonder verbinding of interpolatie. Acht ON-foto’s liggen tussen 2 972 en 3 000 rpm. ON geeft de bemonsteringsstatus aan, geen bewijs van stabilisatie. Geen gecertificeerde curve; OFF-punten bij andere toerentallen worden niet gemengd.", "benchInterpret": "Technische interpretatie en grenzen", "benchThermal": "De genummerde reeks toont “olio” van 25 naar 87 °C en “acqua” van 27 naar 76 °C, daarna meerdere waarden van 76 °C. Dit bewijst geen voorgeschreven testduur of motorlimiet: volledige motorcode en sensorlocaties ontbreken.", "benchNearZero": "IMG_3848: 4 m³/h en 93.9 m bij 3 000 rpm. Laag debiet, geen bewezen nuldebiet. Eén kanaal toont nog 3.34 m³/h. De exacte bypass- en koelfunctie vereisen het hydraulische schema.", "benchSettings": "“Nominal Flow 100 m3/h” en “T.Preload 10 min” zijn zichtbare instellingen. Ze bepalen niet het werkelijke nominale groepsdebiet of de uitgevoerde duur. Handgeschreven curve-aantekeningen zijn geen gecertificeerde meetpunten.", "benchPressure": "Negatieve zuigdruk wordt weergegeven; dit bewijst geen cavitatie. Opvoerhoogte: H = (p₂ − p₁)/(ρg) + (v₂² − v₁²)/(2g) + z₂ − z₁. IMG_3842: 7.90 − (−0.23) = 8.13 bar, circa 82.87 m bij ρ = 1 000 kg/m³ en g = 9.81 m/s², vóór snelheids- en hoogtecorrecties. Bank toont 82.9 m; algoritme niet gedocumenteerd.", "benchCabinetText": "Kast: twee A/B-kanalen en twee laadmodules zichtbaar, relais/contactoren en gemarkeerde klemmen. Stekkers lijken RJ45; vorm bewijst geen Ethernetprotocol of pinbezetting. Labels “Pump running” en “FUEL TANK NOT FULL” zijn fotoreferenties, zonder bevestigde contactlogica.", "benchToolsText": "Zichtbaar: banksupervisie, manometers/sensoren en infraroodthermometer in de hand van de operator. Voor bruikbare metingen: referenties, eenheden, meetpunten, kalibratiecertificaten en gesynchroniseerde registratie vastleggen. Infrarood-oppervlaktetemperatuur vervangt geen interne vloeistoftemperatuur.", "benchMissing": "Nog ontbrekende informatie", "benchMissingText": "Pomp-/groeps-/motorplaten en gemonteerde waaier; curvepagina 2/2 en volledig testrapport; werkelijk nominaal punt en acceptatiecriterium; tijdgestempelde bankexport en sensorcertificaten; temperatuur van verpompt water, hoogten en diameters bij drukmeetpunten; debiet- en bypassschema; elektrisch schema, I/O-lijst en juiste kasthandleiding; uitlaattegendruk, afmetingen en nomogrammen. Foto’s vullen dit niet aan.", "benchInventory": "Inventaris van 28 bestanden · 27 unieke beelden", "benchDuplicate": "Identieke kopie van", "benchHardware": "Apparatuurbeeld", "benchScreen": "Supervisiescherm", "benchCurveSheet": "Curveblad", "benchCabinet": "Schakelkast", "benchExport": "Deze documentatiecase exporteren (JSON)", "benchExportNote": "Bevat ruwe aflezingen, referenties, analyse in vier talen en inventaris met SHA-256-hashes. Originele foto’s blijven in het gesprek en zitten niet in deze export."}, "en": {"bench": "Test bench", "benchSub": "Photographed case study · Bari · 21 October 2026", "benchLimit": "Visual training readings without metrological validation. These are neither manufacturer limits nor an acceptance report. This case does not populate your service checks.", "benchIdentity": "Observed equipment and documents", "benchIdentityText": "Horizontal diesel-driven pump; nearby small vertical pump, probable jockey function to confirm. Controller marked EN 17451 System. Sheet: Atmos GIGA NF 125/250.1, document C125250.1-N37, revision 01, 08/04/2026, page 1/2, 50 Hz, 2,985 rpm. Curves Ø250/260/274 mm; Ø250 highlighted. The photo proves neither installed diameter nor exact set identity.", "benchReadings": "16 distinct screen photographs", "benchReadingNote": "Values transcribed as displayed, retaining original decimal points. “olio” and “acqua” are software labels: confirm sensor locations. DN65 and DN200 identify bench channels; DN150/DN300 without readable values remain unknown. Individual photograph times are not established.", "benchSampling": "Displayed sampling", "benchHead": "Displayed head", "benchFlow": "Displayed total flow", "benchWarning": "Display discrepancy to review", "benchMismatch": "IMG_3836: channels show 18.08 + 106.06 = 124.14 m³/h, but displayed total is 109 m³/h and head 53.1 m. IMG_3837/3838: same channel values, total 124 m³/h and head 73 m. Cause unknown: refresh timing or capture state is possible, without a confirmed diagnosis. Retain both readings; do not automatically correct them.", "benchPlot": "Photographed points with ON displayed", "benchPlotNote": "Descriptive scatter without connecting lines or interpolation. Eight ON photographs range from 2,972 to 3,000 rpm. ON is the displayed sampling status, not proof of a steady operating point. This is not a certified curve; OFF points at other speeds are not mixed in.", "benchInterpret": "Technical interpretation and limits", "benchThermal": "The numbered sequence shows “olio” rising from 25 to 87 °C and “acqua” from 27 to 76 °C, followed by several displays at 76 °C. This proves neither the required test duration nor compliance with an engine limit: full engine code and sensor locations are missing.", "benchNearZero": "IMG_3848: 4 m³/h and 93.9 m at 3,000 rpm. This is low flow, not proven zero flow. One channel still shows 3.34 m³/h. Exact bypass and cooling functions require the hydraulic diagram.", "benchSettings": "“Nominal Flow 100 m3/h” and “T.Preload 10 min” are visible settings. They do not establish actual set rated duty or completed duration. Handwritten curve annotations are not certified test points.", "benchPressure": "Negative suction pressure is displayed; this alone does not establish cavitation. Head: H = (p₂ − p₁)/(ρg) + (v₂² − v₁²)/(2g) + z₂ − z₁. IMG_3842: 7.90 − (−0.23) = 8.13 bar, about 82.87 m with ρ = 1,000 kg/m³ and g = 9.81 m/s² before velocity and elevation corrections. Bench displays 82.9 m; its algorithm is undocumented.", "benchCabinetText": "Cabinet: two A/B channels and two charging modules visible, relays/contactors and labelled terminals. Connectors resemble RJ45; neither Ethernet protocol nor pinout follows from their shape. “Pump running” and “FUEL TANK NOT FULL” labels are photographic references without confirmed contact logic.", "benchToolsText": "Visible: bench supervision, gauges/sensors and an infrared thermometer held by the operator. For usable records, log references, units, measuring points, calibration certificates and synchronised acquisition. Infrared surface temperature does not replace internal fluid temperature.", "benchMissing": "Information still missing", "benchMissingText": "Pump/set/engine plates and installed impeller; curve page 2/2 and full test report; actual rated duty and applicable acceptance criterion; timestamped logger export and sensor certificates; pumped-water temperature, elevations and diameters at pressure taps; flow-channel and bypass diagram; electrical diagram, I/O list and exact controller manual; exhaust backpressure measurements, dimensions and loss charts. Photographs do not fill these gaps.", "benchInventory": "Inventory of 28 files · 27 unique images", "benchDuplicate": "Byte-identical copy of", "benchHardware": "Equipment view", "benchScreen": "Supervision screen", "benchCurveSheet": "Curve sheet", "benchCabinet": "Electrical cabinet", "benchExport": "Export this documentary case (JSON)", "benchExportNote": "Includes raw readings, references, four-language analysis and inventory with SHA-256 hashes. Original photos remain in the conversation and are not included in this export."}, "de": {"bench": "Prüfstand", "benchSub": "Fotografiertes Praxisbeispiel · Bari
