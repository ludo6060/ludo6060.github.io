ichés, point décimal d’origine conservé. « olio » et « acqua » sont les libellés du logiciel : emplacement des sondes à confirmer. DN65 et DN200 désignent les voies du banc ; DN150/DN300 sans valeur lisible restent inconnus. L’heure de chaque photo n’est pas établie.", "Cijfers zoals weergegeven, oorspronkelijke decimale punt behouden. “olio” en “acqua” zijn softwarelabels: sensorlocaties te bevestigen. DN65 en DN200 zijn bankkanalen; DN150/DN300 zonder leesbare waarde blijven onbekend. Tijdstip per foto niet vastgesteld.", "Values transcribed as displayed, retaining original decimal points. “olio” and “acqua” are software labels: confirm sensor locations. DN65 and DN200 identify bench channels; DN150/DN300 without readable values remain unknown. Individual photograph times are not established.", "Zahlen wie angezeigt mit ursprünglichem Dezimalpunkt. „olio“ und „acqua“ sind Softwarebezeichnungen: Fühlerpositionen bestätigen. DN65 und DN200 sind Prüfstandskanäle; DN150/DN300 ohne lesbaren Wert bleiben unbekannt. Uhrzeit je Foto nicht festgestellt."], "benchSampling": ["Échantillonnage affiché", "Weergegeven bemonstering", "Displayed sampling", "Angezeigte Erfassung"], "benchHead": ["Hauteur affichée", "Weergegeven opvoerhoogte", "Displayed head", "Angezeigte Förderhöhe"], "benchFlow": ["Débit total affiché", "Weergegeven totaal debiet", "Displayed total flow", "Angezeigter Gesamtdurchfluss"], "benchWarning": ["Écart d’affichage à vérifier", "Weergaveverschil te controleren", "Display discrepancy to review", "Anzeigeabweichung prüfen"], "benchMismatch": ["IMG_3836 : 18.08 + 106.06 = 124.14 m³/h sur les voies, mais total affiché 109 m³/h et hauteur 53.1 m. IMG_3837/3838 : mêmes valeurs des voies, total 124 m³/h et hauteur 73 m. Cause inconnue : rafraîchissement ou état de capture possible, sans diagnostic certain. Conserver les deux lectures ; ne pas corriger automatiquement.", "IMG_3836: 18.08 + 106.06 = 124.14 m³/h op de kanalen, maar totaal 109 m³/h en hoogte 53.1 m. IMG_3837/3838: dezelfde kanaalwaarden, totaal 124 m³/h en hoogte 73 m. Oorzaak onbekend: mogelijk verversing of opnamefase, zonder zekere diagnose. Beide waarden bewaren; niet automatisch corrigeren.", "IMG_3836: channels show 18.08 + 106.06 = 124.14 m³/h, but displayed total is 109 m³/h and head 53.1 m. IMG_3837/3838: same channel values, total 124 m³/h and head 73 m. Cause unknown: refresh timing or capture state is possible, without a confirmed diagnosis. Retain both readings; do not automatically correct them.", "IMG_3836: Kanäle zeigen 18.08 + 106.06 = 124.14 m³/h, Gesamtanzeige jedoch 109 m³/h und Höhe 53.1 m. IMG_3837/3838: gleiche Kanalwerte, Gesamtanzeige 124 m³/h und Höhe 73 m. Ursache unbekannt: Aktualisierung oder Erfassungszustand möglich, keine gesicherte Diagnose. Beide Ablesungen erhalten; nicht automatisch korrigieren."], "benchPlot": ["Points photographiés avec affichage ON", "Gefotografeerde punten met ON-weergave", "Photographed points with ON displayed", "Fotografierte Punkte mit Anzeige ON"], "benchPlotNote": ["Nuage descriptif sans liaison ni interpolation. Les huit captures ON se situent entre 2 972 et 3 000 tr/min. ON indique l’état affiché de l’échantillonnage, sans prouver un palier stabilisé. Ce graphique n’est pas une courbe certifiée ; les points OFF à d’autres régimes ne sont pas mélangés.", "Beschrijvende punten zonder verbinding of interpolatie. Acht ON-foto’s liggen tussen 2 972 en 3 000 rpm. ON geeft de bemonsteringsstatus aan, geen bewijs van stabilisatie. Geen gecertificeerde curve; OFF-punten bij andere toerentallen worden niet gemengd.", "Descriptive scatter without connecting lines or interpolation. Eight ON photographs range from 2,972 to 3,000 rpm. ON is the displayed sampling status, not proof of a steady operating point. This is not a certified curve; OFF points at other speeds are not mixed in.", "Beschreibende Punkte ohne Verbindung oder Interpolation. Acht ON-Aufnahmen liegen zwischen 2 972 und 3 000 U/min. ON ist der angezeigte Erfassungszustand und kein Nachweis eines stabilen Betriebspunkts. Keine zertifizierte Kennlinie; OFF-Punkte anderer Drehzahlen werden nicht beigemischt."], "benchInterpret": ["Lecture technique et limites", "Technische interpretatie en grenzen", "Technical interpretation and limits", "Technische Auswertung und Grenzen"], "benchThermal": ["La séquence numérotée montre la montée des températures « olio » de 25 à 87 °C et « acqua » de 27 à 76 °C. On observe ensuite plusieurs affichages à 76 °C. Cela ne démontre ni la durée d’essai prescrite ni le respect d’une limite moteur : son code complet et les positions des sondes manquent.", "De genummerde reeks toont “olio” van 25 naar 87 °C en “acqua” van 27 naar 76 °C, daarna meerdere waarden van 76 °C. Dit bewijst geen voorgeschreven testduur of motorlimiet: volledige motorcode en sensorlocaties ontbreken.", "The numbered sequence shows “olio” rising from 25 to 87 °C and “acqua” from 27 to 76 °C, followed by several displays at 76 °C. This proves neither the required test duration nor compliance with an engine limit: full engine code and sensor locations are missing.", "Die nummerierte Folge zeigt „olio“ von 25 auf 87 °C und „acqua“ von 27 auf 76 °C, anschließend mehrfach 76 °C. Dies belegt weder vorgeschriebene Prüfdauer noch Einhaltung einer Motorgrenze: vollständiger Motorcode und Fühlerpositionen fehlen."], "benchNearZero": ["IMG_3848 : 4 m³/h et 93.9 m à 3 000 tr/min. C’est un point de faible débit, pas un débit nul prouvé. Une voie indique encore 3.34 m³/h. Le rôle exact du bypass et du refroidissement exige le schéma hydraulique.", "IMG_3848: 4 m³/h en 93.9 m bij 3 000 rpm. Laag debiet, geen bewezen nuldebiet. Eén kanaal toont nog 3.34 m³/h. De exacte bypass- en koelfunctie vereisen het hydraulische schema.", "IMG_3848: 4 m³/h and 93.9 m at 3,000 rpm. This is low flow, not proven zero flow. One channel still shows 3.34 m³/h. Exact bypass and cooling functions require the hydraulic diagram.", "IMG_3848: 4 m³/h und 93.9 m bei 3 000 U/min. Geringer Durchfluss, kein belegter Nulldurchfluss. Ein Kanal zeigt weiterhin 3.34 m³/h. Genaue Bypass- und Kühlfunktion erfordern das Hydraulikschema."], "benchSettings": ["« Nominal Flow 100 m3/h » et « T.Preload 10 min » sont des réglages visibles. Ils ne suffisent pas à établir le débit nominal réel du groupe ou la durée effectivement réalisée. Les annotations manuscrites de la courbe ne sont pas des points d’essai certifiés.", "“Nominal Flow 100 m3/h” en “T.Preload 10 min” zijn zichtbare instellingen. Ze bepalen niet het werkelijke nominale groepsdebiet of de uitgevoerde duur. Handgeschreven curve-aantekeningen zijn geen gecertificeerde meetpunten.", "“Nominal Flow 100 m3/h” and “T.Preload 10 min” are visible settings. They do not establish actual set rated duty or completed duration. Handwritten curve annotations are not certified test points.", "„Nominal Flow 100 m3/h“ und „T.Preload 10 min“ sind sichtbare Einstellungen. Sie belegen weder tatsächlichen Nennbetriebspunkt noch absolvierte Dauer. Handschriftliche Kennlinienmarkierungen sind keine zertifizierten Messpunkte."], "benchPressure": ["Une pression d’aspiration négative est affichée ; elle ne suffit pas à conclure à une cavitation. Pour comparer la hauteur : H = (p₂ − p₁)/(ρg) + (v₂² − v₁²)/(2g) + z₂ − z₁. Exemple IMG_3842 : 7.90 − (−0.23) = 8.13 bar, soit environ 82.87 m avec ρ = 1 000 kg/m³ et g = 9.81 m/s², avant corrections de vitesse et d’altitude. Le banc affiche 82.9 m ; son algorithme n’est pas documenté.", "Negatieve zuigdruk wordt weergegeven; dit bewijst geen cavitatie. Opvoerhoogte: H = (p₂ − p₁)/(ρg) + (v₂² − v₁²)/(2g) + z₂ − z₁. IMG_3842: 7.90 − (−0.23) = 8.13 bar, circa 82.87 m bij ρ = 1 000 kg/m³ en g = 9.81 m/s², vóór snelheids- en hoogtecorrecties. Bank toont 82.9 m; algoritme niet gedocumenteerd.", "Negative suction pressure is displayed; this alone does not establish cavitation. Head: H = (p₂ − p₁)/(ρg) + (v₂² − v₁²)/(2g) + z₂ − z₁. IMG_3842: 7.90 − (−0.23) = 8.13 bar, about 82.87 m with ρ = 1,000 kg/m³ and g = 9.81 m/s² before velocity and elevation corrections. Bench displays 82.9 m; its algorithm is undocumented.", "Negativer Saugdruck wird angezeigt; dies allein belegt keine Kavitation. Förderhöhe: H = (p₂ − p₁)/(ρg) + (v₂² − v₁²)/(2g) + z₂ − z₁. IMG_3842: 7.90 − (−0.23) = 8.13 bar, etwa 82.87 m bei ρ = 1 000 kg/m³ und g = 9.81 m/s² vor Geschwindigkeits- und Höhenkorrektur. Prüfstand zeigt 82.9 m; Algorithmus nicht dokumentiert."], "benchCabinetText": ["Coffret : deux voies A/B et deux modules de charge visibles, relais/contacteurs et borniers repérés. Les prises ressemblent à des RJ45 ; ni protocole Ethernet ni brochage ne peuvent être déduits de leur forme. Les étiquettes « Pump running » et « FUEL TANK NOT FULL » servent de repères photographiques, sans logique de contact confirmée.", "Kast: twee A/B-kanalen en twee laadmodules zichtbaar, relais/contactoren en gemarkeerde klemmen. Stekkers lijken RJ45; vorm bewijst geen Ethernetprotocol of pinbezetting. Labels “Pump running” en “FUEL TANK NOT FULL” zijn fotoreferenties, zonder bevestigde contactlogica.", "Cabinet: two A/B channels and two charging modules visible, relays/contactors and labelled terminals. Connectors resemble RJ45; neither Ethernet protocol nor pinout follows from their shape. “Pump running” and “FUEL TANK NOT FULL” labels are photographic references without confirmed contact logic.", "Schrank: zwei A/B-Kanäle und zwei Lademodule sichtbar, Relais/Schütze und beschriftete Klemmen. Stecker ähneln RJ45; daraus folgen weder Ethernetprotokoll noch Belegung. „Pump running“ und „FUEL TANK NOT FULL“ sind Fotoreferenzen ohne bestätigte Kontaktlogik."], "benchToolsText": ["Visible : supervision du banc, manomètres/capteurs et thermomètre infrarouge tenu par l’opérateur. Pour rendre un relevé exploitable : consigner références, unités, points de mesure, certificats d’étalonnage et acquisition synchronisée. Une mesure infrarouge de surface ne remplace pas la température interne du fluide.", "Zichtbaar: banksupervisie, manometers/sensoren en infraroodthermometer in de hand van de operator. Voor bruikbare metingen: referenties, eenheden, meetpunten, kalibratiecertificaten en gesynchroniseerde registratie vastleggen. Infrarood-oppervlaktetemperatuur vervangt geen interne vloeistoftemperatuur.", "Visible: bench supervision, gauges/sensors and an infrared thermometer held by the operator. For usable records, log references, units, measuring points, calibration certificates and synchronised acquisition. Infrared surface temperature does not replace internal fluid temperature.", "Sichtbar: Prüfstandsüberwachung, Manometer/Sensoren und Infrarotthermometer in der Hand des Bedieners. Für auswertbare Daten Referenzen, Einheiten, Messstellen, Kalibriernachweise und synchronisierte Erfassung dokumentieren. Infrarot-Oberflächentemperatur ersetzt keine innere Fluidtemperatur."], "benchMissing": ["Informations encore manquantes", "Nog ontbrekende informatie", "Information still missing", "Noch fehlende Informationen"], "benchMissingText": ["Plaques pompe/groupe/moteur et roue montée ; page 2/2 de la courbe et rapport d’essai complet ; point nominal réel et critère d’acceptation applicable ; export horodaté du banc et certificats capteurs ; température de l’eau pompée, niveaux et diamètres aux prises de pression ; schéma des voies de débit et bypass ; schéma électrique, liste d’E/S et manuel exact du coffret ; mesures de contre-pression d’échappement, dimensions et abaques. Les photos ne comblent pas ces absences.", "Pomp-/groeps-/motorplaten en gemonteerde waaier; curvepagina 2/2 en volledig testrapport; werkelijk nominaal punt en acceptatiecriterium; tijdgestempelde bankexport en sensorcertificaten; temperatuur van verpompt water, hoogten en diameters bij drukmeetpunten; debiet- en bypassschema; elektrisch schema, I/O-lijst en juiste kasthandleiding; uitlaattegendruk, afmetingen en nomogrammen. Foto’s vullen dit niet aan.", "Pump/set/engine plates and installed impeller; curve page 2/2 and full test report; actual rated duty and applicable acceptance criterion; timestamped logger export and sensor certificates; pumped-water temperature, elevations and diameters at pressure taps; flow-channel and bypass diagram; electrical diagram, I/O list and exact controller manual; exhaust backpressure measurements, dimensions and loss charts. Photographs do not fill these gaps.", "Pumpen-/Aggregat-/Motorschilder und montiertes Laufrad; Kennlinienseite 2/2 und vollständiger Prüfbericht; tatsächlicher Nennpunkt und geltendes Abnahmekriterium; zeitgestempelter Prüfstandsexport und Sensornachweise; Temperatur des Förderwassers, Höhen und Durchmesser an Druckmessstellen; Durchflusskanal- und Bypassschema; Schaltplan, E/A-Liste und genaue Steuerungsanleitung; Abgasgegendruck, Abmessungen und Verlustdiagramme. Fotos schließen diese Lücken nicht."], "benchInventory": ["Inventaire des 28 fichiers · 27 images uniques", "Inventaris van 28 bestanden · 27 unieke beelden", "Inventory of 28 files · 27 unique images", "Inventar: 28 Dateien · 27 einzelne Bilder"], "benchDuplicate": ["Doublon binaire de", "Identieke kopie van", "Byte-identical copy of", "Bytegleiches Duplikat von"], "benchHardware": ["Vue du matériel", "Apparatuurbeeld", "Equipment view", "Ausrüstungsansicht"], "benchScreen": ["Écran de supervision", "Supervisiescherm", "Supervision screen", "Überwachungsbildschirm"], "benchCurveSheet": ["Fiche de courbes", "Curveblad", "Curve sheet", "Kennlinienblatt"], "benchCabinet": ["Coffret électrique", "Schakelkast", "Electrical cabinet", "Schaltschrank"], "benchExport": ["Exporter ce cas documentaire (JSON)", "Deze documentatiecase exporteren (JSON)", "Export this documentary case (JSON)", "Dieses Dokumentationsbeispiel exportieren (JSON)"], "benchExportNote": ["Contient les lectures brutes, les références, l’analyse en quatre langues et l’inventaire avec empreintes SHA-256. Les photos originales sont conservées dans la conversation et ne sont pas incluses dans cet export.", "Bevat ruwe aflezingen, referenties, analyse in vier talen en inventaris met SHA-256-hashes. Originele foto’s blijven in het gesprek en zitten niet in deze export.", "Includes raw readings, references, four-language analysis and inventory with SHA-256 hashes. Original photos remain in the conversation and are not included in this export.", "Enthält Rohablesungen, Referenzen, Analyse in vier Sprachen und Inventar mit SHA-256-Prüfsummen. Originalfotos bleiben im Gespräch und sind in diesem Export nicht enthalten."], "homeTitle": ["Votre atelier, sur le terrain.", "Uw werkplaats, op locatie.", "Your workshop, in the field.", "Ihre Werkstatt vor Ort."], "courseScope": ["Périmètre du cours", "Omvang van de opleiding", "Course scope", "Umfang der Schulung"], "scopeSiFire": ["Gamme SiFire", "SiFire-reeks", "SiFire range", "SiFire-Baureihe"], "scopeSiFireText": ["SiFire EN et SiFire FIRST : identifier le groupe et consulter sa notice exacte avant de retenir les contrôles.", "SiFire EN en SiFire FIRST: identificeer de pompset en raadpleeg de juiste handleiding vóór de controles te kiezen.", "SiFire EN and SiFire FIRST: identify the set and consult its exact manual before selecting checks.", "SiFire EN und SiFire FIRST: Aggregat identifizieren und vor Auswahl der Prüfungen die genaue Anleitung heranziehen."], "scopeFireSet": ["Formulaires FireSet N45", "FireSet N45-formulieren", "FireSet N45 forms", "FireSet-N45-Formulare"], "scopeFireSetText": ["Pré-mise en service, mise en service et performances : formulaires EN 17451 photographiés. Maintenance : fiches EN 12845.", "Voorinbedrijfstelling, inbedrijfstelling en prestaties: gefotografeerde EN 17451-formulieren. Onderhoud: EN 12845-bladen.", "Pre-commissioning, commissioning and performance: photographed EN 17451 forms. Maintenance: EN 12845 sheets.", "Vorinbetriebnahme, Inbetriebnahme und Leistung: fotografierte EN-17451-Formulare. Wartung: EN-12845-Blätter."], "scopeCommon": ["Guides transversaux et diesel", "Algemene gidsen en diesel", "Cross-range guides and diesel", "Baureihenübergreifende Leitfäden und Diesel"], "scopeCommonText": ["Alignement, échappement, ventilation, refroidissement, batteries et fixation ; atelier IVECO/FPT/Bimotor, dont N67. Applicabilité à confirmer par matériel.", "Uitlijning, uitlaat, ventilatie, koeling, accu’s en bevestiging; IVECO/FPT/Bimotor-workshop, waaronder N67. Toepasselijkheid per apparaat bevestigen.", "Alignment, exhaust, ventilation, cooling, batteries and fixing; IVECO/FPT/Bimotor workshop, including N67. Confirm applicability for each equipment item.", "Ausrichtung, Abgas, Lüftung, Kühlung, Batterien und Befestigung; IVECO/FPT/Bimotor-Workshop einschließlich N67. Anwendbarkeit je Ausrüstung bestätigen."], "sourceFireSet": ["Source : formulaire FireSet N45", "Bron: FireSet N45-formulier", "Source: FireSet N45 form", "Quelle: FireSet-N45-Formular"], "sourceMaintenance": ["Source : fiche maintenance EN 12845", "Bron: onderhoudsblad EN 12845", "Source: EN 12845 maintenance sheet", "Quelle: EN-12845-Wartungsblatt"], "sourceCommon": ["Source : guide transversal", "Bron: algemene gids", "Source: cross-range guide", "Quelle: übergreifender Leitfaden"], "homeIntro": ["Contrôler, mesurer et documenter les groupes SiFire et FireSet.", "SiFire- en FireSet-pompsets controleren, meten en documenteren.", "Check, measure and document SiFire and FireSet pump sets.", "SiFire- und FireSet-Aggregate prüfen, messen und dokumentieren."], "heroTitle": ["Une intervention bien documentée.", "Een goed gedocumenteerde interventie.", "A well-documented service visit.", "Ein gut dokumentierter Serviceeinsatz."], "heroText": ["Identifiez le groupe, suivez les contrôles et conservez les résultats avec leurs sources.", "Identificeer de pompset, voer de controles uit en bewaar de resultaten met hun bronnen.", "Identify the pump set, work through the checks and keep results with their sources.", "Aggregat identifizieren, Prüfungen durchführen und Ergebnisse mit Quellen festhalten."], "beginChecks": ["Commencer les contrôles", "Controles starten", "Start checks", "Prüfungen beginnen"], "checksRecorded": ["Contrôles renseignés", "Ingevulde controles", "Recorded checks", "Dokumentierte Prüfungen"], "findings": ["Anomalies", "Afwijkingen", "Findings", "Abweichungen"], "technicalTables": ["Tableaux de formation", "Opleidingstabellen", "Training tables", "Schulungstabellen"], "languages": ["Langues de travail", "Werktalen", "Working languages", "Arbeitssprachen"], "installation": ["Installation et intervention", "Installatie en interventie", "Installation and visit", "Anlage und Einsatz"], "project": ["Installation / client", "Installatie / klant", "Site / customer", "Anlage / Kunde"], "tech": ["Technicien", "Technicus", "Technician", "Techniker"], "date": ["Date", "Datum", "Date", "Datum"], "workOrder": ["Ordre de travail", "Werkorder", "Work order", "Arbeitsauftrag"], "range": ["Gamme du groupe", "Productreeks pompset", "Pump-set range", "Baureihe des Aggregats"], "article": ["Article Wilo", "Wilo-artikel", "Wilo article", "Wilo-Artikel"], "serial": ["Numéro de série", "Serienummer", "Serial number", "Seriennummer"], "pumpModel": ["Modèle de pompe", "Pompmodel", "Pump model", "Pumpenmodell"], "driver": ["Entraînement", "Aandrijving", "Driver", "Antrieb"], "electric": ["Électrique", "Elektrisch", "Electric", "Elektrisch"], "diesel": ["Diesel", "Diesel", "Diesel", "Diesel"], "engineCode": ["Code moteur complet", "Volledige motorcode", "Full engine code", "Vollständiger Motorcode"], "ratedPower": ["Puissance nominale", "Nominaal vermogen", "Rated power", "Nennleistung"], "ratedSpeed": ["Régime", "Toerental", "Speed", "Drehzahl"], "cooling": ["Refroidissement", "Koeling", "Cooling", "Kühlung"], "directAir": ["Air direct", "Directe luchtkoeling", "Direct air", "Direkte Luftkühlung"], "direct_air": ["Air direct", "Directe luchtkoeling", "Direct air", "Direkte Luftkühlung"], "radiat ive data; verify for the installed engine.", "Richtwerte; für den eingebauten Motor prüfen."], "coolingConflict": ["Conflit documentaire : EV-14 indique 3 bar au réducteur ; EV-23 indique 2,5 bar maximum en aval. Aucun réglage automatique : confirmer le circuit exact.", "Documentconflict: EV-14 noemt 3 bar bij het reduceerventiel; EV-23 maximaal 2,5 bar erna. Geen automatische instelling: bevestig het exacte circuit.", "Document conflict: EV-14 states 3 bar at the reducer; EV-23 states a 2.5 bar maximum downstream. No automatic setting: confirm the exact circuit.", "Dokumentenkonflikt: EV-14 nennt 3 bar am Druckminderer; EV-23 maximal 2,5 bar dahinter. Keine automatische Einstellung: genauen Kreislauf bestätigen."], "indicativeVentilation": ["Ventilation indicative", "Indicatieve ventilatie", "Indicative ventilation", "Lüftungsrichtwert"], "ventFormulaNote": ["Formules du guide EV-13. Les valeurs tabulaires peuvent différer ; vérifier pertes, grilles, ventilateur et configuration. Aucun verdict de conformité.", "Formules uit EV-13. Tabelwaarden kunnen afwijken; controleer verliezen, roosters, ventilator en configuratie. Geen conformiteitsbeoordeling.", "EV-13 guide formulas. Tabulated values can differ; check losses, grilles, fan and configuration. No compliance verdict.", "Formeln aus EV-13. Tabellenwerte können abweichen; Verluste, Gitter, Lüfter und Konfiguration prüfen. Keine Konformitätsaussage."], "ventilationTable": ["Ventilation · EV-13", "Ventilatie · EV-13", "Ventilation · EV-13", "Lüftung · EV-13"], "coolingTable": ["Refroidissement · EV-14", "Koeling · EV-14", "Cooling · EV-14", "Kühlung · EV-14"], "batteryTable": ["Batteries · EV-18", "Accu’s · EV-18", "Batteries · EV-18", "Batterien · EV-18"], "diagnosticsSub": ["Partir d’un symptôme, consigner une mesure.", "Vertrek van een symptoom en registreer een meting.", "Start from a symptom and record a measurement.", "Von einem Symptom ausgehen und einen Messwert festhalten."], "diagnosticNote": ["Pistes de c const KEY='sifire.atelier.v04';
const locales=['fr','nl','en','de'];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const cleanState=()=>({schema:'sifire.atelier',version:4,language:'fr',fields:{date:today(),range:'',driver:'',cooling:'',coupling:''},checks:{},photos:[],measurements:{},legacy:null,updatedAt:null});
let state=cleanState(),storageOK=true,tab='home',filter='all',query='',noticeTimer,restoring=false,restoreTimestamp=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(key){const a=Object.hasOwn(labels,key)?labels[key]:null;return a?a[locales.indexOf(state.language)]||a[0]:key}
function num(key){const s=String(state.fields[key]??'').trim().replace(',','.');if(!s)return null;const n=Number(s);return Number.isFinite(n)?n:null}
function fmt(n,d=3){return n===null||n===undefined||!Number.isFinite(Number(n))?'—':Number(n).toLocaleString(localeNames[state.language],{maximumFractionDigits:d})}
function toast(msg){if(restoring)return;$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function storageError(){storageOK=false;$('storagewarning').hidden=false;$('storagewarning').textContent=t('storageError')}
function save(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;$('storagewarning').hidden=true}catch{storageError()}updateBadge()}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);state=validateImport(data);restoreResults(data);return}const old=localStorage.getItem('sifire.form');if(old){importLegacy(JSON.parse(old),false);for(const s of ['pre','com'])state.legacy.checklists[s]=Array.from({length:12},(_,i)=>localStorage.getItem('sifire.'+s+i)==='1');save()}}catch{storageError()}}
function updateBadge(){$('savebadge').innerHTML=`<span class="dot"></span>${esc(storageOK?t('localSaved'):t('storageErrorShort'))}`}
const tabs=['home','pre','com','maintenance','alignment','hydraulics','bench','exhaust','ventilation','diagnostics','tools','sources','report'];
function go(id){tab=id;filter='all';query='';render();window.scrollTo({top:0,behavior:'smooth'})}
function header(title,sub=''){return `<div class="pagehead"><div><div class="eyebrow">${esc(t('workspace'))}</div><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div><span class="badge amber">${esc(t('draft'))}</span></div>`}
function card(h,body){return `<section class="card"><h2>${esc(h)}</h2>${body}</section>`}
function input(key,label,type='text',unit='',wide=false){return `<div class="field ${wide?'wide':''}"><label for="f-${key}">${esc(label)}${unit?' · '+esc(unit):''}</label>${type==='textarea'?`<textarea id="f-${key}" data-field="${key}">${esc(state.fields[key])}</textarea>`:`<input id="f-${key}" data-field="${key}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(state.fields[key])}" ${type==='number'?'inputmode="decimal"':''}>`}</div>`}
function select(key,label,options){return `<div class="field"><label for="f-${key}">${esc(label)}</label><select id="f-${key}" data-field="${key}"><option value="">${esc(t('select'))}</option>${options.map(([v,s])=>`<option value="${esc(v)}" ${state.fields[key]===v?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`}
function checkModule(c){if(c.id==='maint.leaks')return 'com';if(c.id.startsWith('maint.'))return 'maintenance';if(c.id.startsWith('align.'))return 'alignment';if(c.id.startsWith('exhaust.'))return 'exhaust';if(c.id.startsWith('report.'))return 'report';if(c.id.startsWith('test.')||c.id==='electric.current'||c.id==='maint.leaks')return 'com';return 'pre'}
const allChecks=corpus.checks.map(c=>({...c,module:checkModule(c)}));
function resultOptions(value){return ['not_checked','pass','fail','not_applicable'].map(v=>`<option value="${v}" ${v===value?'selected':''}>${esc(t(v))}</option>`).join('')}

const snapshotKeys={water:['waterQ','waterD'],points:['q100','initialT','finalT'],alignment:['coupling','couplingRef','toleranceSource','al_top','al_right','al_bottom','al_left','al_diameter','al_tolerance','al_offset','al_offsetTolerance'],backpressure:['ex_engineCode','ex_limitSource','ex_limit','ex_measured','ex_measurementPoint','ex_conditions'],ventilation:['vent_power','vent_cooling']};
function snapshot(key){return JSON.stringify(snapshotKeys[key].map(k=>state.fields[k]??''))}
function setMeasurement(key,values,message){state.measurements[key]={time:restoreTimestamp||new Date().toISOString(),inputSnapshot:snapshot(key),values,message};if(!restoring){save();render()}}
function restoreResults(data){restoring=true;try{for(const key of Object.keys(snapshotKeys)){const old=data.measurements?.[key];if(old&&old.inputSnapshot===snapshot(key)){restoreTimestamp=typeof old.time==='string'&&Number.isFinite(Date.parse(old.time))?old.time:null;calculate(key)}}}finally{restoring=false;restoreTimestamp=null}}
function invalid(){toast(t('invalidValues'))}
function calculate(key){if(key==='water'){const q=num('waterQ'),d=num('waterD');if(q===null||d===null||q<0||d<=0)return invalid();setMeasurement('water',[{label:'waterVelocity',value:q/3600/(Math.PI*(d/1000)**2/4),unit:'m/s'}],'noSizingVerdict')}
if(key==='points'){const q=num('q100'),a=num('initialT'),b=num('finalT');let values=[];if(q!==null){if(q<0)return invalid();values.push({label:'point140',value:1.4*q,unit:'m³/h'},{label:'bypass2',value:.02*q,unit:'m³/h'})}if(a!==null&&b!==null)values.push({label:'temperatureRise',value:b-a,unit:'°C'});if(!values.length||(a===null)!==(b===null))return invalid();setMeasurement('points',values,'bypassCondition')}
if(key==='alignment'){if(state.fields.coupling!=='elastic'){toast(t('elasticOnly'));return}const v=['top','right','bottom','left'].map(x=>num('al_'+x)),d=num('al_diameter'),tol=num('al_tolerance'),off=num('al_offset'),ptol=num('al_offsetTolerance');if(v.some(x=>x===null||x<0)||d===null||d<=0||[tol,off,ptol].some(x=>x!==null&&x<0))return invalid();const angle=100*Math.hypot(v[0]-v[2],v[1]-v[3])/d;let values=[{label:'gapVariation',value:Math.max(...v)-Math.min(...v),unit:'mm'},{label:'angularity',value:angle,unit:'mm / 100 mm'}];let message='toleranceNotAssessed';if(tol!==null&&state.fields.toleranceSource?.trim()&&state.fields.couplingRef?.trim()){message=angle<=tol?'withinEnteredTolerance':'outsideEnteredTolerance';if(off!==null&&ptol!==null&&off>ptol)message='outsideEnteredTolerance'}setMeasurement('alignment',values,message)}
if(key==='backpressure'){const lim=num('ex_limit'),meas=num('ex_measured');if(lim===null||lim<=0||meas===null||meas<0)return invalid();if(['ex_engineCode','ex_limitSource','ex_measurementPoint','ex_conditions'].some(k=>!state.fields[k]?.trim())){toast(t('completeEngineData'));return}setMeasurement('backpressure',[{label:'measuredBackpressure',value:meas,unit:'kPa'},{label:'backpressureLimit',value:lim,unit:'kPa'},{label:'pressureMargin',value:lim-meas,unit:'kPa'}],meas<=lim?'withinEnteredLimit':'aboveEnteredLimit')}
if(key==='ventilation'){const p=num('vent_power'),c=state.fields.vent_cooling;if(p===null||p<=0||!['direct_air','radiator','heat_exchanger'].includes(c))return invalid();setMeasurement('ventilation',[{label:'indicativeVentilation',value:p*(c==='heat_exchanger'?50:100),unit:'m³/h'}],'ventFormulaNote')}}
function render(){document.documentElement.lang=state.language;$('nav').innerHTML=tabs.map((id,i)=>`<button data-go="${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')}</span><span>${esc(t(id))}</span></button>`).join('');$('languages').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.language));$('sidebottom').innerHTML=`${esc(t('independentTool'))}<br>Corpus Bari · 0.2<br>${esc(t('localData'))}`;updateBadge();const views={home,pre:()=>checkPage('pre'),com:()=>checkPage('com'),maintenance:()=>checkPage('maintenance'),alignment:alignmentPage,hydraulics:hydraulicsPage,bench:benchPage,exhaust:exhaustPage,ventilation:ventilationPage,diagnostics:diagnosticsPage,tools:toolsPage,sources:sourcesPage,report:reportPage};$('content').innerHTML=views[tab]();if(!storageOK)storageError()}
function safeText(v,max=20000){return typeof v==='string'?v.slice(0,max):''}
function validateImport(o){if(!o||o.schema!=='sifire.atelier'||o.version!==4||!o.fields||typeof o.fields!=='object')throw Error('schema');const n=cleanState();n.language=locales.includes(o.language)?o.language:'fr';for(const [k,v] of Object.entries(o.fields)){if(/^[A-Za-z][A-Za-z0-9_]{0,60}$/.test(k)&&!['__proto__','constructor','prototype'].includes(k))n.fields[k]=safeText(v)}for(const c of allChecks){const v=o.checks?.[c.id];if(v&&['not_checked','pass','fail','not_applicable'].includes(v.result))n.checks[c.id]={result:v.result,note:safeText(v.note)}}if(Array.isArray(o.photos))n.photos=o.photos.slice(0,8).filter(p=>typeof p.data==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.data)&&p.data.length<1500000).map(p=>({name:safeText(p.name,100),data:p.data}));n.legacy=o.legacy&&typeof o.legacy==='object'?{version:3,checklists:{pre:Array.isArray(o.legacy.checklists?.pre)?o.legacy.checklists.pre.slice(0,12).map(Boolean):[],com:Array.isArray(o.legacy.checklists?.com)?o.legacy.checklists.com.slice(0,12).map(Boolean):[]}}:null;
// Les résultats importés sont recalculés sur demande ; ne pas accepter un verdict externe.
n.updatedAt=safeText(o.updatedAt,100);return n}
function importLegacy(form,show=true,checklists={}){state=cleanState();for(const k of ['project','tech','date','notes'])state.fields[k]=safeText(form?.[k]);state.legacy={version:3,checklists:{pre:Array.isArray(checklists.pre)?checklists.pre.slice(0,12).map(Boolean):[],com:Array.isArray(checklists.com)?checklists.com.slice(0,12).map(Boolean):[]}};if(show)toast(t('legacyNote'))}
function download(data,name,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportJSON(){save();download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'Wilo_FireFighting_'+(state.fields.date||today())+'.json','application/json')}
function printReport(){save();const c=summaryCounts();let fields=Object.entries(state.fields).filter(([,v])=>v).map(([k,v])=>`<tr><td>${esc(fieldLabel(k))}</td><td class="printnotes">${esc(Object.hasOwn(labels,v)?t(v):v)}</td></tr>`).join('');let checkbody=tabs.filter(k=>allChecks.some(c=>c.module===k)).map(k=>`<h2>${esc(t(k))}</h2><table><tr><th>${esc(t('checklist'))}</th><th>${esc(t('result'))}</th><th>${esc(t('observation'))}</th><th>${esc(t('source'))}</th></tr>${allChecks.filter(c=>c.module===k).map(c=>{let r=state.checks[c.id]||{result:'not_checked',note:''};return `<tr><td>${esc(c.text[state.language])}</td><td>${esc(t(r.result))}${r.result==='not_applicable'&&!r.note.trim()?' · '+esc(t('reasonRequired')):''}</td><td class="printnotes">${esc(r.note)}</td><td>${esc(c.source_id)} · ${esc(sourceScope(c.source_id))}</td></tr>`}).join('')}</table>`).join('');const computed=Object.keys(state.measurements).map(k=>`<h3>${esc(t(k))}</h3>${measurementHTML(k)}`).join('');$('printout').innerHTML=`<h1>Wilo FireFighting · ${esc(t('report'))}</h1><p>V0.4.2 · Corpus Bari 0.2 · ${esc(new Date().toLocaleString(localeNames[state.language]))}</p><p>${c.done}/${c.total} · ${esc(t('checksRecorded'))} · ${esc(t('findings'))}: ${c.fail}</p><p>${esc(t('reportDisclaimer'))}</p><h2>${esc(t('installation'))}</h2><table>${fields}</table>${computed?'<h2>'+esc(t('calculations'))+'</h2>'+computed:''}${checkbody}${state.legacy?`<h2>V0.3</h2><p>${esc(t('legacyNote'))}</p><p>${esc(JSON.stringify(state.legacy.checklists))}</p>`:''}${state.photos.length?'<h2>'+esc(t('photos'))+'</h2>'+state.photos.map(p=>`<div class="printphoto"><img src="${esc(p.data)}" alt=""><p>${esc(p.name)}</p></div>`).join(''):''}<h2>${esc(t('signatures'))}</h2><p>${esc(t('tech'))}: ____________________</p><p>${esc(t('handedTo'))}: ____________________</p>`;window.print()}
const fieldUnits={power:'kW',speed:'rpm',al_top:'mm',al_right:'mm',al_bottom:'mm',al_left:'mm',al_diameter:'mm',al_tolerance:'mm / 100 mm',al_offset:'mm',al_offsetTolerance:'mm',waterQ:'m³/h',waterD:'mm',q100:'m³/h',initialT:'°C',finalT:'°C',suction:'bar',discharge:'bar',testFlow:'m³/h',testSpeed:'rpm',voltage:'V',current:'A',frequency:'Hz',ambientT:'°C',ex_limit:'kPa',ex_measured:'kPa',ex_length:'m',ex_diameter:'mm',vent_power:'kW'};
function fieldLabel(k){const label=Object.hasOwn(fieldLabels,k)?t(fieldLabels[k]):k;return label+(fieldUnits[k]?' · '+fieldUnits[k]:'')}
const fieldLabels={"project": "project", "tech": "tech", "date": "date", "wo": "workOrder", "range": "range", "article": "article", "serial": "serial", "pump": "pumpModel", "driver": "driver", "engineCode": "engineCode", "power": "ratedPower", "speed": "ratedSpeed", "cooling": "cooling", "controller": "controller", "norm": "normEdition", "coupling": "coupling", "couplingRef": "couplingRef", "toleranceSource": "toleranceSource", "al_top": "top", "al_right": "right", "al_bottom": "bottom", "al_left": "left", "al_diameter": "measureDiameter", "al_tolerance": "angularTolerance", "al_offset": "parallelOffset", "al_offsetTolerance": "parallelTolerance", "beta1": "β1 (°)", "beta2": "β2 (°)", "cardanForks": "forkPlane", "cardanNotes": "observation", "waterQ": "flow", "waterD": "insideDiameter", "q100": "ratedFlow", "initialT": "initialTemperature", "finalT": "finalTemperature", "suction": "suctionPressure", "discharge": "dischargePressure", "testFlow": "measuredFlow", "testSpeed": "ratedSpeed", "voltage": "voltage", "current": "current", "frequency": "frequencyHz", "ambientT": "ambientTemperature", "instrument": "instrument", "calibration": "calibrationDate", "testNotes": "observation", "ex_engineCode": "engineCode", "ex_limitSource": "limitSource", "ex_limit": "backpressureLimit", "ex_measured": "measuredBackpressure", "ex_measurementPoint": "measurementPoint", "ex_conditions": "speedLoad", "ex_length": "pipeLength", "ex_diameter": "insideDiameter", "ex_90": "elbows90", "ex_45": "elbows45", "ex_silencer": "silencerRef", "ex_lossSource": "lossSource", "ex_notes": "observation", "vent_power": "ratedPower", "vent_cooling": "cooling", "symptom": "symptoms", "faultCode": "faultCode", "faultController": "controllerRef", "diagnosticNotes": "diagnosticObservations", "toolList": "instrumentsUsed", "toolCertificates": "calibrationReferences", "notes": "findingsActions", "parts": "partsReplaced", "finalState": "finalState", "handover": "handedTo", "reportLanguage": "signatureNote"};
async function addPhotos(files){for(const file of Array.from(files)){if(state.photos.length>=8){toast(t('photoLimit'));break}if(!file.type.startsWith('image/'))continue;try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*s));canvas.height=Math.max(1,Math.round(im.height*s));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.7))};im.src=reader.result};reader.readAsDataURL(file)});state.photos.push({name:file.name.slice(0,100),data});save()}catch{toast(t('photoError'))}}render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.lang){state.language=b.dataset.lang;save();render();return}if(b.dataset.removePhoto!==undefined){state.photos.splice(Number(b.dataset.removePhoto),1);save();render();return}const action=b.dataset.action;if(action==='benchExport'){download(JSON.stringify(corpus.bench,null,2),'Wilo_Bari_bench_2026-10-21.json','application/json');return}if(snapshotKeys[action]){calculate(action);return}if(action==='export')exportJSON();if(action==='print')printReport();if(action==='import')$('importInput').click();if(action==='downloadApp'){const copy=document.documentElement.cloneNode(true);copy.querySelector('#content').innerHTML='';copy.querySelector('#printout').innerHTML='';copy.querySelector('#nav').innerHTML='';copy.querySelector('#toast').hidden=true;copy.querySelector('#storagewarning').hidden=true;download('<!doctype html>\n'+copy.outerHTML,'Wilo_FireFighting_v042.html','text/html;charset=utf-8')}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){state.fields[el.dataset.field]=el.value;save();for(const key of Object.keys(snapshotKeys)){if(snapshotKeys[key].includes(el.dataset.field)&&state.measurements[key]){const resultId={water:'waterResult',points:'pointsResult',alignment:'alignmentResult',backpressure:'backpressureResult',ventilation:'ventilationResult'}[key];if($(resultId))$(resultId).innerHTML=measurementHTML(key)}}}if(el.dataset.note){const r=state.checks[el.dataset.note]||{result:'not_checked',note:''};r.note=el.value;state.checks[el.dataset.note]=r;save()}if(el.id==='search'){query=el.value;$('checklistbody').innerHTML=checksHTML(tab)}});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.field){state.fields[el.dataset.field]=el.value;save()}if(el.dataset.check){const r=state.checks[el.dataset.check]||{note:''};r.result=el.value;state.checks[el.dataset.check]=r;save();const note=el.closest('.checkrow').querySelector('textarea');note.placeholder=r.result==='not_applicable'?t('reasonRequired'):t('observation');if($('checkprogressCount')){const list=allChecks.filter(c=>c.module===tab),done=list.filter(c=>state.checks[c.id]?.result&&state.checks[c.id].result!=='not_checked').length;$('checkprogressCount').textContent=done+' / '+list.length;$('checkprogressBar').style.width=(list.length?done/list.length*100:0)+'%'}}if(el.id==='filter'){filter=el.value;$('checklistbody').innerHTML=checksHTML(tab)}if(el.id==='photosInput')await addPhotos(el.files);if(el.id==='importInput'&&el.files[0]){try{if(el.files[0].size>15000000)throw Error('size');const data=JSON.parse(await el.files[0].text());if(!confirm(t('importConfirm')))return;if(data.schema==='sifire.atelier'){const imported=validateImport(data);state=imported;restoreResults(data)}else if(data.form&&data.checklists)importLegacy(data.form,false,data.checklists);else throw Error('schema');save();render();toast(t('importOK'))}catch{toast(t('importError'))}}});
load();render();
</script></body></html>
